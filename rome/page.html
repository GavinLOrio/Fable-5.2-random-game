<title>Aquila</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D canvas; a thin HUD in the corners; every menu is one centred parchment panel over a dark scrim. */
:root {
  color-scheme: dark;
  --ink: #241a10;
  --ink2: #5c4a36;
  --parch: #efe3c8;
  --parch2: #e2d2ae;
  --line: #b89c6a;
  --red: #8c1d18;
  --red2: #b3302a;
  --gold: #d9ad4e;
  --night: #120d08;
  --hp: #c8372d;
  --stam: #6fae4a;
  --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --body: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  --sl: max(14px, env(safe-area-inset-left, 0px));
  --sr: max(14px, env(safe-area-inset-right, 0px));
  --st: max(10px, env(safe-area-inset-top, 0px));
  --sb: max(12px, env(safe-area-inset-bottom, 0px));
  --hs: 1;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--night); color: var(--parch); font: 500 16px/1.4 var(--body); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
#hud > * { position: absolute; }
#bars { top: var(--st); left: var(--sl); display: grid; grid-template-columns: auto 1fr; gap: 3px 9px; align-items: center; transform: scale(var(--hs)); transform-origin: top left; }
#lvl { grid-row: span 2; width: 40px; height: 40px; display: grid; place-items: center; font: 800 17px var(--display); color: var(--ink); background: radial-gradient(circle at 35% 30%, #f6e2a8, var(--gold) 60%, #9a7426); border-radius: 50%; box-shadow: 0 0 0 2px rgba(18, 13, 8, 0.8); text-shadow: none; }
.bar { width: clamp(120px, 20vw, 220px); height: 11px; background: rgba(18, 13, 8, 0.72); border: 1px solid rgba(217, 173, 78, 0.5); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--hp); transition: width 0.12s; }
.bar.st { height: 7px; } .bar.st i { background: var(--stam); }
#purse { grid-column: 1 / -1; font-size: 13.5px; font-weight: 700; color: var(--parch); display: flex; gap: 12px; }
#purse b { color: var(--gold); }
#compass { top: var(--st); left: 50%; transform: translateX(-50%); width: min(44vw, 380px); display: flex; flex-direction: column; align-items: center; gap: 2px; }
#compassCv { width: 100%; height: 26px; }
#objective { font-size: clamp(12.5px, 1.5vw, 15px); font-weight: 700; text-align: center; text-wrap: balance; max-width: 100%; }
#objective small { display: block; font: 600 10.5px var(--display); letter-spacing: 0.16em; color: var(--gold); text-transform: uppercase; }
#topbtns { top: var(--st); right: var(--sr); display: flex; gap: 7px; pointer-events: auto; transform: scale(var(--hs)); transform-origin: top right; }
.ib { width: 40px; height: 40px; border-radius: 9px; background: rgba(18, 13, 8, 0.66); border: 1px solid rgba(217, 173, 78, 0.55); display: grid; place-items: center; padding: 0; position: relative; }
.ib svg { width: 21px; height: 21px; fill: none; stroke: var(--parch); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ib em { position: absolute; right: -4px; top: -5px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--red2); font: 700 10px/15px var(--body); text-align: center; text-shadow: none; }
#prompt { left: 50%; bottom: calc(var(--sb) + 132px); transform: translateX(-50%); pointer-events: auto; display: flex; align-items: center; gap: 9px; padding: 8px 16px 8px 9px; border-radius: 999px; background: rgba(18, 13, 8, 0.78); border: 1px solid var(--gold); font-weight: 700; font-size: 15px; white-space: nowrap; }
#prompt b { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px; background: var(--gold); color: var(--ink); display: grid; place-items: center; font: 800 12px var(--display); text-shadow: none; }
body.touch #prompt b { display: none; } body.touch #prompt { padding: 11px 20px; bottom: calc(var(--sb) + 20px); }
#actions { right: var(--sr); bottom: var(--sb); width: 214px; height: 190px; pointer-events: none; transform: scale(var(--hs)); transform-origin: bottom right; }
.ab { position: absolute; pointer-events: auto; border-radius: 50%; background: rgba(18, 13, 8, 0.6); border: 1.5px solid rgba(217, 173, 78, 0.7); display: grid; place-items: center; padding: 0; touch-action: none; }
.ab svg { width: 46%; height: 46%; fill: none; stroke: var(--parch); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ab em { position: absolute; right: 0; top: -3px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--ink); border: 1px solid var(--gold); font: 700 11px/16px var(--body); text-align: center; }
.ab:active { background: rgba(217, 173, 78, 0.35); }
.ab.off { opacity: 0.32; }
#aAtk { width: 86px; height: 86px; right: 0; bottom: 0; border-color: var(--gold); } #aBlk { width: 62px; height: 62px; right: 96px; bottom: 2px; } #aDge { width: 62px; height: 62px; right: 70px; bottom: 76px; }
#aPil { width: 52px; height: 52px; right: 2px; bottom: 98px; } #aEat { width: 46px; height: 46px; right: 150px; bottom: 76px; } #aMnt { width: 46px; height: 46px; right: 166px; bottom: 10px; }
body:not(.touch) #actions { width: auto; height: auto; display: flex; gap: 6px; align-items: flex-end; }
body:not(.touch) .ab { position: relative; width: 40px !important; height: 40px !important; right: auto !important; bottom: auto !important; border-radius: 9px; }
body:not(.touch) .ab::after { content: attr(data-key); position: absolute; left: 50%; bottom: -15px; transform: translateX(-50%); font: 700 9.5px var(--display); letter-spacing: 0.08em; color: var(--parch); opacity: 0.8; white-space: nowrap; }
body:not(.touch) #actions { bottom: calc(var(--sb) + 14px); }
#toast { top: 21%; left: 50%; transform: translateX(-50%); width: min(92vw, 760px); text-align: center; opacity: 0; transition: opacity 0.5s; font: 800 clamp(22px, 4.4vw, 42px) var(--display); letter-spacing: 0.14em; color: var(--parch); text-shadow: 0 0 22px rgba(217, 173, 78, 0.5), 0 3px 10px #000; text-wrap: balance; }
#toast small { display: block; margin-top: 6px; font: 700 clamp(11px, 1.5vw, 14px) var(--body); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
#toast.on { opacity: 1; }
#notes { left: var(--sl); top: calc(var(--st) + 86px); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
#notes div { padding: 4px 10px; border-radius: 6px; background: rgba(18, 13, 8, 0.7); border-left: 3px solid var(--gold); font-size: 13.5px; font-weight: 700; animation: note 4s forwards; }
@keyframes note { 0% { opacity: 0; transform: translateX(-10px); } 8% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
#foe { top: calc(var(--st) + 64px); left: 50%; transform: translateX(-50%); width: min(60vw, 420px); text-align: center; font: 800 13px var(--display); letter-spacing: 0.12em; }
#foe .bar { width: 100%; height: 9px; margin-top: 3px; }
#fps { left: var(--sl); bottom: var(--sb); font-size: 11px; opacity: 0.8; }
#saved { right: var(--sr); top: calc(var(--st) + 50px); font: 700 11px var(--display); letter-spacing: 0.16em; color: var(--gold); opacity: 0; transition: opacity 0.4s; }
#saved.on { opacity: 1; }
#dmg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.dn { position: absolute; left: 0; top: 0; display: none; font: 700 16px var(--body); color: #fff; text-shadow: 0 1px 3px #000; will-change: transform; }
.dn.crit { font-size: 22px; color: var(--gold); } .dn.heal { color: #9be07a; } .dn.hurt { color: #ff6a5a; } .dn.xp { color: #9fd0ff; font-size: 13px; }
#vignette, #fade { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
#vignette { background: radial-gradient(ellipse at center, transparent 45%, rgba(170, 20, 15, 0.65) 100%); }
#fade { background: #000; transition: opacity 0.35s; } #fade.on { opacity: 1; }
#joy { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.06); pointer-events: none; display: none; }
#joy.on { display: block; }
#joyknob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%; background: rgba(217, 173, 78, 0.6); transform: translate(-50%, -50%); }

/* ---------- dialogue ---------- */
#dialog { position: fixed; left: 50%; bottom: calc(var(--sb) + 10px); transform: translateX(-50%); width: min(94vw, 760px); padding: 14px 20px 12px; background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); cursor: pointer; }
#dname { font: 800 14px var(--display); letter-spacing: 0.1em; color: var(--red); margin-bottom: 3px; }
#dtext { font-size: clamp(15.5px, 1.9vw, 18.5px); line-height: 1.42; min-height: 2.8em; }
#dtext.narr { font-style: italic; color: var(--ink2); }
#dnext { text-align: right; font: 700 11px var(--display); letter-spacing: 0.16em; color: var(--ink2); margin-top: 4px; }

/* ---------- overlays ---------- */
.ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px; padding-block: var(--st) var(--sb); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(12, 8, 5, 0.72); overflow-y: auto; }
#title { background: linear-gradient(180deg, rgba(12, 8, 5, 0.5), rgba(12, 8, 5, 0.12) 45%, rgba(12, 8, 5, 0.82)); text-align: center; }
#title h1 { margin: 0; font: 800 clamp(48px, 12vw, 120px)/1 var(--display); letter-spacing: 0.16em; padding-left: 0.16em; color: var(--parch); text-shadow: 0 0 30px rgba(217, 173, 78, 0.55), 0 4px 16px #000; }
#title p { margin: 0; font: 700 clamp(11px, 1.7vw, 15px) var(--display); letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); text-shadow: 0 2px 8px #000; }
.col { display: flex; flex-direction: column; gap: 9px; align-items: stretch; width: min(100%, 300px); }
.btn { padding: 12px 22px; font: 800 14px var(--display); letter-spacing: 0.16em; text-transform: uppercase; border-radius: 6px; border: 1.5px solid #5e120f; background: linear-gradient(180deg, var(--red2), var(--red)); color: #fbeed0; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45); }
.btn:hover { filter: brightness(1.12); }
.btn.alt { background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border-color: var(--line); }
.btn.sm { padding: 7px 13px; font-size: 11.5px; letter-spacing: 0.1em; box-shadow: none; }
.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
.panel { width: min(100%, 720px); max-height: 100%; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; box-shadow: 0 16px 60px rgba(0, 0, 0, 0.7); overflow: hidden; }
.panel.narrow { width: min(100%, 400px); }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: rgba(140, 29, 24, 0.08); }
.phead h2 { margin: 0; font: 800 clamp(16px, 2.6vw, 21px) var(--display); letter-spacing: 0.12em; color: var(--red); }
.x { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--ink); font: 700 17px/1 var(--body); padding: 0; flex: none; }
.pbody { padding: 12px 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink2); font: 700 12px var(--display); letter-spacing: 0.08em; }
.tabs button.on { background: var(--red); border-color: var(--red); color: #fbeed0; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, 0.28); }
.row.on { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.row .tx { flex: 1; min-width: 0; }
.row .nm { font: 800 14.5px var(--display); letter-spacing: 0.04em; }
.row .ds { font-size: 14px; color: var(--ink2); line-height: 1.32; }
.row .stt { font-size: 13px; font-weight: 700; color: var(--red); }
.muted { color: var(--ink2); font-size: 14px; }
.sect { font: 800 11.5px var(--display); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink2); margin-top: 4px; }
.set { display: grid; grid-template-columns: 1fr minmax(120px, 46%); gap: 8px 14px; align-items: center; font-size: 15px; font-weight: 700; }
.set small { display: block; font-weight: 500; color: var(--ink2); font-size: 12.5px; line-height: 1.25; }
.set input[type=range] { width: 100%; accent-color: var(--red); }
.set select, .set input[type=text] { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1.5px solid var(--line); background: #f8f0dc; color: var(--ink); font: 600 14.5px var(--body); }
.set input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--red); justify-self: start; }
#mapscr { padding: 0; background: #1a2a30; }
#mapCv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#mapTop { position: absolute; top: var(--st); left: var(--sl); right: var(--sr); display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
#mapTop h2 { margin: 0; font: 800 clamp(15px, 2.4vw, 20px) var(--display); letter-spacing: 0.14em; color: var(--ink); background: rgba(239, 227, 200, 0.9); padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--line); }
#mapTop .x { pointer-events: auto; background: var(--parch); }
#mapCard { position: absolute; left: 50%; bottom: var(--sb); transform: translateX(-50%); width: min(94vw, 520px); padding: 12px 16px; background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 6px; }
#mapCard h3 { margin: 0; font: 800 17px var(--display); letter-spacing: 0.08em; color: var(--red); }
#mapCard h3 small { font: 700 11px var(--display); letter-spacing: 0.14em; color: var(--ink2); margin-left: 8px; }
#mapCard p { margin: 0; font-size: 14.5px; line-height: 1.35; }
#loading { background: var(--night); text-align: center; }
#loading h2 { margin: 0; font: 800 40px var(--display); letter-spacing: 0.2em; color: var(--parch); }
#loading p { margin: 0; letter-spacing: 0.28em; text-transform: uppercase; font-size: 12px; color: var(--gold); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14.5px; }
.keys b { font: 800 12px var(--display); letter-spacing: 0.06em; color: var(--red); white-space: nowrap; }
@media (max-width: 640px) and (orientation: portrait) {
  #compass { top: calc(var(--st) + 86px); width: 88vw; }
  #notes { top: calc(var(--st) + 150px); }
  #foe { top: calc(var(--st) + 150px); }
  #toast { top: 30%; }
  .set { grid-template-columns: 1fr; gap: 3px; }
}
@media (max-height: 480px) {
  #toast { top: 26%; font-size: 24px; }
  #title h1 { font-size: 54px; } .ov { gap: 8px; } .btn { padding: 9px 18px; }
  #dialog { padding: 9px 14px 8px; } #dtext { font-size: 15px; min-height: 2.6em; }
  #mapCard p { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { #notes div { animation-duration: 4s; } #fade { transition: none; } }
</style>

<script>/*__BUNDLE__*/</script>
