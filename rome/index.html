<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Aquila</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D canvas; a thin HUD in the corners; every menu is one centred parchment panel over a dark scrim. */
:root {
  color-scheme: dark;
  --ink: #241a10;
  --ink2: #5c4a36;
  --parch: #efe3c8;
  --parch2: #e2d2ae;
  --line: #b89c6a;
  --red: #8c1d18;
  --red2: #b3302a;
  --gold: #d9ad4e;
  --night: #120d08;
  --hp: #c8372d;
  --stam: #6fae4a;
  --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --body: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  --sl: max(14px, env(safe-area-inset-left, 0px));
  --sr: max(14px, env(safe-area-inset-right, 0px));
  --st: max(10px, env(safe-area-inset-top, 0px));
  --sb: max(12px, env(safe-area-inset-bottom, 0px));
  --hs: 1;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--night); color: var(--parch); font: 500 16px/1.4 var(--body); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
#hud > * { position: absolute; }
#bars { top: var(--st); left: var(--sl); display: grid; grid-template-columns: auto 1fr; gap: 3px 9px; align-items: center; transform: scale(var(--hs)); transform-origin: top left; }
#lvl { grid-row: span 2; width: 40px; height: 40px; display: grid; place-items: center; font: 800 17px var(--display); color: var(--ink); background: radial-gradient(circle at 35% 30%, #f6e2a8, var(--gold) 60%, #9a7426); border-radius: 50%; box-shadow: 0 0 0 2px rgba(18, 13, 8, 0.8); text-shadow: none; }
.bar { width: clamp(120px, 20vw, 220px); height: 11px; background: rgba(18, 13, 8, 0.72); border: 1px solid rgba(217, 173, 78, 0.5); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--hp); transition: width 0.12s; }
.bar.st { height: 7px; } .bar.st i { background: var(--stam); }
#purse { grid-column: 1 / -1; font-size: 13.5px; font-weight: 700; color: var(--parch); display: flex; gap: 12px; }
#purse b { color: var(--gold); }
#compass { top: var(--st); left: 50%; transform: translateX(-50%); width: min(44vw, 380px); display: flex; flex-direction: column; align-items: center; gap: 2px; }
#compassCv { width: 100%; height: 26px; }
#objective { font-size: clamp(12.5px, 1.5vw, 15px); font-weight: 700; text-align: center; text-wrap: balance; max-width: 100%; }
#objective small { display: block; font: 600 10.5px var(--display); letter-spacing: 0.16em; color: var(--gold); text-transform: uppercase; }
#topbtns { top: var(--st); right: var(--sr); display: flex; gap: 7px; pointer-events: auto; transform: scale(var(--hs)); transform-origin: top right; }
.ib { width: 40px; height: 40px; border-radius: 9px; background: rgba(18, 13, 8, 0.66); border: 1px solid rgba(217, 173, 78, 0.55); display: grid; place-items: center; padding: 0; position: relative; }
.ib svg { width: 21px; height: 21px; fill: none; stroke: var(--parch); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ib em { position: absolute; right: -4px; top: -5px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--red2); font: 700 10px/15px var(--body); text-align: center; text-shadow: none; }
#prompt { left: 50%; bottom: calc(var(--sb) + 132px); transform: translateX(-50%); pointer-events: auto; display: flex; align-items: center; gap: 9px; padding: 8px 16px 8px 9px; border-radius: 999px; background: rgba(18, 13, 8, 0.78); border: 1px solid var(--gold); font-weight: 700; font-size: 15px; white-space: nowrap; }
#prompt b { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px; background: var(--gold); color: var(--ink); display: grid; place-items: center; font: 800 12px var(--display); text-shadow: none; }
body.touch #prompt b { display: none; } body.touch #prompt { padding: 11px 20px; bottom: calc(var(--sb) + 20px); }
#actions { right: var(--sr); bottom: var(--sb); width: 214px; height: 190px; pointer-events: none; transform: scale(var(--hs)); transform-origin: bottom right; }
.ab { position: absolute; pointer-events: auto; border-radius: 50%; background: rgba(18, 13, 8, 0.6); border: 1.5px solid rgba(217, 173, 78, 0.7); display: grid; place-items: center; padding: 0; touch-action: none; }
.ab svg { width: 46%; height: 46%; fill: none; stroke: var(--parch); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ab em { position: absolute; right: 0; top: -3px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--ink); border: 1px solid var(--gold); font: 700 11px/16px var(--body); text-align: center; }
.ab:active { background: rgba(217, 173, 78, 0.35); }
.ab.off { opacity: 0.32; }
#aAtk { width: 86px; height: 86px; right: 0; bottom: 0; border-color: var(--gold); } #aBlk { width: 62px; height: 62px; right: 96px; bottom: 2px; } #aDge { width: 62px; height: 62px; right: 70px; bottom: 76px; }
#aSnk { width: 46px; height: 46px; right: 126px; bottom: 138px; } .ab.lit { background: rgba(217, 173, 78, 0.5); border-color: var(--gold); }
#lockHint { left: 50%; bottom: calc(var(--sb) + 76px); transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(18, 13, 8, 0.72); border: 1px solid rgba(217, 173, 78, 0.6); font-size: 13.5px; font-weight: 700; white-space: nowrap; }
#aPil { width: 52px; height: 52px; right: 2px; bottom: 98px; } #aEat { width: 46px; height: 46px; right: 150px; bottom: 76px; } #aMnt { width: 46px; height: 46px; right: 166px; bottom: 10px; }
body:not(.touch) #actions { width: auto; height: auto; display: flex; gap: 6px; align-items: flex-end; }
body:not(.touch) .ab { position: relative; width: 40px !important; height: 40px !important; right: auto !important; bottom: auto !important; border-radius: 9px; }
body:not(.touch) .ab::after { content: attr(data-key); position: absolute; left: 50%; bottom: -15px; transform: translateX(-50%); font: 700 9.5px var(--display); letter-spacing: 0.08em; color: var(--parch); opacity: 0.8; white-space: nowrap; }
body:not(.touch) #actions { bottom: calc(var(--sb) + 14px); }
#toast { top: 21%; left: 50%; transform: translateX(-50%); width: min(92vw, 760px); text-align: center; opacity: 0; transition: opacity 0.5s; font: 800 clamp(22px, 4.4vw, 42px) var(--display); letter-spacing: 0.14em; color: var(--parch); text-shadow: 0 0 22px rgba(217, 173, 78, 0.5), 0 3px 10px #000; text-wrap: balance; }
#toast small { display: block; margin-top: 6px; font: 700 clamp(11px, 1.5vw, 14px) var(--body); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
#toast.on { opacity: 1; }
#notes { left: var(--sl); top: calc(var(--st) + 86px); max-width: min(46vw, 420px); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
#notes div { padding: 4px 10px; border-radius: 6px; background: rgba(18, 13, 8, 0.7); border-left: 3px solid var(--gold); font-size: 13.5px; font-weight: 700; animation: note 4s forwards; }
@keyframes note { 0% { opacity: 0; transform: translateX(-10px); } 8% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
#foe { top: calc(var(--st) + 64px); left: 50%; transform: translateX(-50%); width: min(60vw, 420px); text-align: center; font: 800 13px var(--display); letter-spacing: 0.12em; }
#foe .bar { width: 100%; height: 9px; margin-top: 3px; }
#fps { left: var(--sl); bottom: var(--sb); font-size: 11px; opacity: 0.8; }
#saved { right: var(--sr); top: calc(var(--st) + 50px); font: 700 11px var(--display); letter-spacing: 0.16em; color: var(--gold); opacity: 0; transition: opacity 0.4s; }
#saved.on { opacity: 1; }
#dmg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.dn { position: absolute; left: 0; top: 0; display: none; font: 700 16px var(--body); color: #fff; text-shadow: 0 1px 3px #000; will-change: transform; }
.dn.crit { font-size: 22px; color: var(--gold); } .dn.heal { color: #9be07a; } .dn.hurt { color: #ff6a5a; } .dn.xp { color: #9fd0ff; font-size: 13px; }
#vignette, #fade { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
#vignette { background: radial-gradient(ellipse at center, transparent 45%, rgba(170, 20, 15, 0.65) 100%); }
#fade { background: #000; transition: opacity 0.35s; } #fade.on { opacity: 1; }
#joy { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.06); pointer-events: none; display: none; }
#joy.on { display: block; }
#joyknob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%; background: rgba(217, 173, 78, 0.6); transform: translate(-50%, -50%); }

/* ---------- dialogue ---------- */
#dialog { position: fixed; left: 50%; bottom: calc(var(--sb) + 10px); transform: translateX(-50%); width: min(94vw, 760px); padding: 14px 20px 12px; background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); cursor: pointer; }
#dname { font: 800 14px var(--display); letter-spacing: 0.1em; color: var(--red); margin-bottom: 3px; }
#dtext { font-size: clamp(15.5px, 1.9vw, 18.5px); line-height: 1.42; min-height: 2.8em; }
#dtext.narr { font-style: italic; color: var(--ink2); }
#dnext { text-align: right; font: 700 11px var(--display); letter-spacing: 0.16em; color: var(--ink2); margin-top: 4px; }

/* ---------- overlays ---------- */
.ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px; padding-block: var(--st) var(--sb); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(12, 8, 5, 0.72); overflow-y: auto; }
#title { background: linear-gradient(180deg, rgba(12, 8, 5, 0.5), rgba(12, 8, 5, 0.12) 45%, rgba(12, 8, 5, 0.82)); text-align: center; }
#title h1 { margin: 0; font: 800 clamp(48px, 12vw, 120px)/1 var(--display); letter-spacing: 0.16em; padding-left: 0.16em; color: var(--parch); text-shadow: 0 0 30px rgba(217, 173, 78, 0.55), 0 4px 16px #000; }
#title p { margin: 0; font: 700 clamp(11px, 1.7vw, 15px) var(--display); letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); text-shadow: 0 2px 8px #000; }
.col { display: flex; flex-direction: column; gap: 9px; align-items: stretch; width: min(100%, 300px); }
.btn { padding: 12px 22px; font: 800 14px var(--display); letter-spacing: 0.16em; text-transform: uppercase; border-radius: 6px; border: 1.5px solid #5e120f; background: linear-gradient(180deg, var(--red2), var(--red)); color: #fbeed0; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45); }
.btn:hover { filter: brightness(1.12); }
.btn.alt { background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border-color: var(--line); }
.btn.sm { padding: 7px 13px; font-size: 11.5px; letter-spacing: 0.1em; box-shadow: none; }
.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
.panel { width: min(100%, 720px); max-height: 100%; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; box-shadow: 0 16px 60px rgba(0, 0, 0, 0.7); overflow: hidden; }
.panel.narrow { width: min(100%, 400px); }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: rgba(140, 29, 24, 0.08); }
.phead h2 { margin: 0; font: 800 clamp(16px, 2.6vw, 21px) var(--display); letter-spacing: 0.12em; color: var(--red); }
.x { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--ink); font: 700 17px/1 var(--body); padding: 0; flex: none; }
.pbody { padding: 12px 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink2); font: 700 12px var(--display); letter-spacing: 0.08em; }
.tabs button.on { background: var(--red); border-color: var(--red); color: #fbeed0; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, 0.28); }
.row.on { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.row .tx { flex: 1; min-width: 0; }
.row .nm { font: 800 14.5px var(--display); letter-spacing: 0.04em; }
.row .ds { font-size: 14px; color: var(--ink2); line-height: 1.32; }
.row .stt { font-size: 13px; font-weight: 700; color: var(--red); }
.muted { color: var(--ink2); font-size: 14px; }
.sect { font: 800 11.5px var(--display); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink2); margin-top: 4px; }
.set { display: grid; grid-template-columns: 1fr minmax(120px, 46%); gap: 8px 14px; align-items: center; font-size: 15px; font-weight: 700; }
.set small { display: block; font-weight: 500; color: var(--ink2); font-size: 12.5px; line-height: 1.25; }
.set input[type=range] { width: 100%; accent-color: var(--red); }
.set select, .set input[type=text] { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1.5px solid var(--line); background: #f8f0dc; color: var(--ink); font: 600 14.5px var(--body); }
.set input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--red); justify-self: start; }
#mapscr { padding: 0; background: #1a2a30; }
#mapCv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#mapTop { position: absolute; top: var(--st); left: var(--sl); right: var(--sr); display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
#mapTop h2 { margin: 0; font: 800 clamp(15px, 2.4vw, 20px) var(--display); letter-spacing: 0.14em; color: var(--ink); background: rgba(239, 227, 200, 0.9); padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--line); }
#mapTop .x { pointer-events: auto; background: var(--parch); }
#mapCard { position: absolute; left: 50%; bottom: var(--sb); transform: translateX(-50%); width: min(94vw, 520px); padding: 12px 16px; background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 6px; }
#mapCard h3 { margin: 0; font: 800 17px var(--display); letter-spacing: 0.08em; color: var(--red); }
#mapCard h3 small { font: 700 11px var(--display); letter-spacing: 0.14em; color: var(--ink2); margin-left: 8px; }
#mapCard p { margin: 0; font-size: 14.5px; line-height: 1.35; }
#tabs { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: center; align-items: center; gap: 6px; padding: calc(var(--st) + 2px) var(--sr) 8px var(--sl); background: linear-gradient(180deg, rgba(18, 13, 8, 0.92), rgba(18, 13, 8, 0.72) 70%, transparent); }
#tabs [data-tab] { padding: 9px clamp(10px, 3vw, 26px); border-radius: 8px; border: 1.5px solid rgba(217, 173, 78, 0.45); background: rgba(18, 13, 8, 0.6); color: var(--parch); font: 800 clamp(11.5px, 1.6vw, 14px) var(--display); letter-spacing: 0.14em; text-transform: uppercase; }
#tabs [data-tab].on { background: linear-gradient(180deg, var(--red2), var(--red)); border-color: var(--gold); color: #fbeed0; }
#tabs .x { margin-left: 6px; background: var(--parch); }
body.menu #panelOv { padding-top: calc(var(--st) + 58px); justify-content: flex-start; }
body.menu #panelOv .panel { max-height: calc(100% - 4px); }
.sheet { display: grid; grid-template-columns: repeat(auto-fit, minmax(86px, 1fr)); gap: 8px; }
.sheet div { padding: 8px 6px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, 0.3); text-align: center; font: 700 10.5px var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink2); }
.sheet b { display: block; font: 800 19px var(--display); letter-spacing: 0.02em; color: var(--red); }
.xp { height: 7px; border-radius: 4px; background: rgba(36, 26, 16, 0.18); overflow: hidden; } .xp i { display: block; height: 100%; background: var(--gold); }
.worn { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
.worn button { padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: rgba(255, 255, 255, 0.28); color: var(--ink); font: 800 13px var(--display); text-align: left; }
.worn button small { display: block; font: 700 10px var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink2); }
.worn button.on { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); background: rgba(140, 29, 24, 0.08); }
.actg { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 14px; }
.actv { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 14px; font-weight: 700; } .actv b { color: var(--red); }
.actv i { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: rgba(36, 26, 16, 0.18); overflow: hidden; } .actv em { display: block; height: 100%; background: var(--red2); }
.mcb { display: flex; gap: 8px; flex-wrap: wrap; }
#loading { background: var(--night); text-align: center; }
#loading h2 { margin: 0; font: 800 40px var(--display); letter-spacing: 0.2em; color: var(--parch); }
#loading p { margin: 0; letter-spacing: 0.28em; text-transform: uppercase; font-size: 12px; color: var(--gold); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14.5px; }
.keys b { font: 800 12px var(--display); letter-spacing: 0.06em; color: var(--red); white-space: nowrap; }
@media (max-width: 640px) and (orientation: portrait) {
  #compass { top: calc(var(--st) + 86px); width: 88vw; }
  #notes { top: calc(var(--st) + 190px); max-width: 88vw; }
  #foe { top: calc(var(--st) + 150px); width: 88vw; }
  #toast { top: 30%; }
  .set { grid-template-columns: 1fr; gap: 3px; }
}
@media (max-height: 480px) {
  #toast { top: 36%; font-size: 24px; }
  #notes { max-width: 30vw; } #notes div { font-size: 12px; }
  #foe { width: min(36vw, 420px); }
  #title h1 { font-size: 54px; } .ov { gap: 8px; } .btn { padding: 9px 18px; }
  #dialog { padding: 9px 14px 8px; } #dtext { font-size: 15px; min-height: 2.6em; }
  #mapCard p { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { #notes div { animation-duration: 4s; } #fade { transition: none; } }
</style>

<body>
<canvas id="c" tabindex="0"></canvas>

<div id="hud" hidden>
  <div id="bars">
    <div id="lvl">1</div>
    <div class="bar hp"><i id="hpf"></i></div>
    <div class="bar st"><i id="stf"></i></div>
    <div id="purse"></div>
  </div>
  <div id="compass"><canvas id="compassCv" width="760" height="52"></canvas><div id="objective"></div></div>
  <div id="topbtns">
    <button class="ib" data-act="map" aria-label="Map"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg></button>
    <button class="ib" data-act="bag" aria-label="Gear"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M12 8v8M8.5 11h7"/></svg></button>
    <button class="ib" data-act="log" aria-label="Quests"><svg viewBox="0 0 24 24"><path d="M6 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V5a1 1 0 0 1 1-1zM9 9h6M9 13h6"/></svg><em id="logN" hidden></em></button>
    <button class="ib" data-act="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="notes"></div>
  <div id="foe" hidden><span id="foeName"></span><div class="bar"><i id="foeF"></i></div></div>
  <button id="prompt" data-act="interact" hidden><b>E</b><span id="promptT"></span></button>

w."},{id:"brundisium",name:"Brundisium",lat:40.64,lon:17.94,kind:"city",port:1,region:"Italia",desc:"The end of the Via Appia and the gateway to Greece. Pompey slipped out of this harbour with his army in March 49 BC."},{id:"syracusae",name:"Syracusae",lat:37.07,lon:15.27,kind:"city",port:1,style:"greek",region:"Sicilia",desc:"The greatest Greek city of Sicily, taken by Rome in 212 BC. Archimedes died in the sack; Cicero later found his forgotten tomb."},{id:"caralis",name:"Caralis",lat:39.22,lon:9.12,kind:"town",port:1,region:"Sardinia",desc:"Chief port of Sardinia, an old Punic harbour that sends grain to Rome."},{id:"massilia",name:"Massilia",lat:43.3,lon:5.37,kind:"city",port:1,style:"greek",region:"Gallia",desc:"A Greek colony founded about 600 BC and an old ally of Rome. In 49 BC it shut its gates to Caesar and endured a six-month siege."},{id:"narbo",name:"Narbo Martius",lat:43.18,lon:3,kind:"town",port:1,region:"Gallia",desc:"The first Roman colony in Gaul, founded in 118 BC on the Via Domitia, the road that links Italy to Hispania."},{id:"bibracte",name:"Bibracte",lat:46.92,lon:4.03,kind:"oppidum",region:"Gallia",desc:"Hilltop capital of the Aedui, Rome's oldest allies in Gaul. Caesar finished his commentaries on the Gallic War here in the winter of 52 BC."},{id:"alesia",name:"Alesia",lat:47.54,lon:4.5,kind:"ruin",region:"Gallia",desc:"Where Vercingetorix surrendered in 52 BC after Caesar ringed the hill with two lines of siege works, one facing in and one facing out."},{id:"tarraco",name:"Tarraco",lat:41.12,lon:1.25,kind:"city",port:1,region:"Hispania",desc:"Rome's main base in Nearer Spain since the Scipios landed here against Carthage."},{id:"ilerda",name:"Ilerda",lat:41.62,lon:.62,kind:"camp",region:"Hispania",desc:"In the summer of 49 BC Caesar outmarched Pompey's legates Afranius and Petreius here, cut them off from water and took their surrender almost without a battle."},{id:"carthago_nova",name:"Carthago Nova",lat:37.6,lon:-.98,kind:"city",port:1,style:"punic",region:"Hispania",desc:"Founded by Hasdrubal of Carthage and captured by Scipio in 209 BC. Its silver mines and harbour are the finest in Spain."},{id:"corduba",name:"Corduba",lat:37.88,lon:-4.78,kind:"city",region:"Hispania",desc:"Capital of Further Spain on the river Baetis."},{id:"munda",name:"Munda",lat:37.35,lon:-5.1,kind:"camp",region:"Hispania",desc:"Site of the last battle of the civil war, 17 March 45 BC. Caesar said that elsewhere he had fought for victory, but here for his life."},{id:"gades",name:"Gades",lat:36.53,lon:-6.29,kind:"city",port:1,style:"punic",region:"Hispania",desc:"An ancient Phoenician port beyond the Pillars of Hercules. As a young quaestor Caesar is said to have wept here before a statue of Alexander the Great."},{id:"utica",name:"Utica",lat:37.12,lon:9.9,kind:"city",port:1,style:"punic",region:"Africa",desc:"Capital of Roman Africa since Carthage fell. Cato the Younger held it for the Republic and took his own life here in 46 BC rather than accept Caesar's pardon."},{id:"carthago",name:"Carthago",lat:36.8,lon:10.42,kind:"ruin",style:"punic",region:"Africa",desc:"Destroyed by Scipio Aemilianus in 146 BC and still in ruins. Caesar plans a new colony on the site."},{id:"thapsus",name:"Thapsus",lat:35.62,lon:10.95,kind:"camp",port:1,region:"Africa",desc:"On 6 April 46 BC Caesar broke the army of Metellus Scipio and King Juba of Numidia here. The Fifth Legion earned its elephant emblem facing Juba's war elephants."},{id:"cyrene",name:"Cyrene",lat:32.82,lon:21.86,kind:"city",port:1,style:"greek",region:"Africa",desc:"A Greek city in Libya, grown rich on silphium, a medicinal plant found nowhere else."},{id:"alexandria",name:"Alexandria",lat:31.2,lon:29.92,kind:"urbs",port:1,style:"egypt",region:"Aegyptus",desc:"Founded by Alexander in 331 BC and ruled by the Ptolemies, a Macedonian dynasty. Its Pharos lighthouse and Library are wonders of the world."},{id:"pelusium",name:"Pelusium",lat:31.04,lon:32.55,kind:"town",port:1,style:"egypt",region:"Aegyptus",desc:"The eastern fortress of Egypt. Pompey the Great was murdered in a small boat off this shore on 28 September 48 BC."},{id:"memphis",name:"Memphis",lat:29.86,lon:31.25,kind:"town",style:"egypt",region:"Aegyptus",desc:"The ancient capital of the pharaohs, where the Ptolemies are still crowned in the old Egyptian manner."},{id:"pyramides",name:"Pyramides",lat:30.12,lon:30.78,kind:"pyramids",style:"egypt",region:"Aegyptus",desc:"The pyramids of Giza were already some 2,500 years old in Caesar's day, as distant from him as he is from us."},{id:"dyrrachium",name:"Dyrrachium",lat:41.32,lon:19.45,kind:"city",port:1,style:"greek",region:"Graecia",desc:"The landing place opposite Brundisium and the start of the Via Egnatia. Pompey made it his supply base in 48 BC."},{id:"castra",name:"Castra Caesaris",lat:40.97,lon:19.78,kind:"camp",region:"Graecia",desc:"Caesar tried to pen Pompey against the sea with seventeen miles of earthworks here. In July 48 BC Pompey broke the line and Caesar suffered his worst defeat."},{id:"apollonia",name:"Apollonia",lat:40.6,lon:19.6,kind:"town",style:"greek",region:"Graecia",desc:"A Greek city famous for its schools. Caesar's great-nephew Octavius was studying here when the dictator was killed."},{id:"pharsalus",name:"Pharsalus",lat:39.3,lon:22.38,kind:"camp",region:"Graecia",desc:"On 9 August 48 BC Caesar, outnumbered two to one, routed Pompey on this plain in Thessaly."},{id:"thessalonica",name:"Thessalonica",lat:40.64,lon:22.94,kind:"city",port:1,style:"greek",region:"Graecia",desc:"Capital of Roman Macedonia on the Via Egnatia. The senators who fled with Pompey met here as a Senate in exile."},{id:"athenae",name:"Athenae",lat:37.97,lon:23.73,kind:"city",port:1,style:"greek",region:"Graecia",desc:"No longer a power, but still the school of the world. Young Romans come to study philosophy beneath the Parthenon."},{id:"corinthus",name:"Corinthus",lat:37.9,lon:22.8,kind:"ruin",style:"greek",region:"Graecia",desc:"Sacked and levelled by Mummius in 146 BC, the same year as Carthage. Caesar will refound it as a colony in 44 BC."},{id:"cnossus",name:"Cnossus",lat:35.3,lon:25.16,kind:"town",port:1,style:"greek",region:"Creta",desc:"Old city of Crete, conquered by Metellus in 67 BC. Cretan archers serve as mercenaries in every army."},{id:"rhodus",name:"Rhodus",lat:36.44,lon:28.22,kind:"city",port:1,style:"greek",region:"Asia",desc:"An island republic of sailors and orators where Caesar and Cicero both studied rhetoric. Its bronze Colossus has lain broken since the earthquake of 226 BC."},{id:"ephesus",name:"Ephesus",lat:37.94,lon:27.34,kind:"city",port:1,style:"greek",region:"Asia",desc:"Chief city of the province of Asia, home to the Temple of Artemis, one of the seven wonders."},{id:"byzantium",name:"Byzantium",lat:41.01,lon:28.98,kind:"town",port:1,style:"greek",region:"Thracia",desc:"A Greek town guarding the strait to the Black Sea. Four centuries from now it will be renamed Constantinople."},{id:"tarsus",name:"Tarsus",lat:36.92,lon:34.89,kind:"town",port:1,style:"east",region:"Cilicia",desc:"Capital of Cilicia. Caesar held court here in 47 BC on his way to fight Pharnaces of Pontus."},{id:"zela",name:"Zela",lat:40.3,lon:35.89,kind:"camp",region:"Pontus",desc:"On 2 August 47 BC Caesar destroyed the army of Pharnaces II here in a battle so short that he reported it in three words."},{id:"antiochia",name:"Antiochia",lat:36.2,lon:36.16,kind:"city",style:"east",region:"Syria",desc:"Once the Seleucid capital, now the seat of the Roman governor of Syria since Pompey annexed it in 64 BC."},{id:"tyrus",name:"Tyrus",lat:33.27,lon:35.2,kind:"town",port:1,style:"punic",region:"Syria",desc:"The Phoenician mother city of Carthage, renowned for purple dye made from sea snails."},{id:"hierosolyma",name:"Hierosolyma",lat:31.78,lon:35.23,kind:"city",style:"east",region:"Iudaea",desc:"Jerusalem. Pompey took the city in 63 BC and walked into the Temple's inner sanctuary, but left its treasure untouched."},{id:"neapolis",name:"Neapolis",lat:40.86,lon:14.15,kind:"city",port:1,style:"greek",region:"Italia",desc:'The "new city" of the Greeks on the Bay of Naples, where wealthy Romans keep villas and still speak Greek at dinner.'},{id:"pompeii",name:"Pompeii",lat:40.62,lon:14.78,kind:"town",region:"Italia",desc:"A prosperous Campanian town beneath a green, quiet mountain. No one alive knows Vesuvius is a volcano; it will not erupt for another 128 years."},{id:"tarentum",name:"Tarentum",lat:40.47,lon:17.24,kind:"city",port:1,style:"greek",region:"Italia",desc:"A Spartan colony and once the richest city of Greek Italy. It called in King Pyrrhus against Rome and lost."},{id:"aquileia",name:"Aquileia",lat:45.77,lon:13.37,kind:"city",port:1,region:"Italia",desc:"A fortress colony at the head of the Adriatic. Three of Caesar's legions wintered here before the Gallic War."},{id:"mediolanum",name:"Mediolanum",lat:45.46,lon:9.19,kind:"town",region:"Italia",desc:"Chief town of the Insubrian Gauls in the Po valley. Caesar gave the people north of the Po Roman citizenship in 49 BC."},{id:"genua",name:"Genua",lat:44.41,lon:8.93,kind:"town",port:1,region:"Italia",desc:"The harbour of the Ligurians, rebuilt by Rome after Hannibal's brother Mago burned it."},{id:"messana",name:"Messana",lat:38.19,lon:15.5,kind:"town",port:1,style:"greek",region:"Sicilia",desc:"The town on the strait. A quarrel over it in 264 BC began Rome's first war with Carthage."},{id:"panormus",name:"Panormus",lat:38.12,lon:13.36,kind:"town",port:1,style:"punic",region:"Sicilia",desc:'A Phoenician harbour whose name means "all-haven", taken by Rome in 254 BC.'},{id:"agrigentum",name:"Agrigentum",lat:37.31,lon:13.58,kind:"city",style:"greek",region:"Sicilia",desc:"Greek Akragas, with a ridge of Doric temples. Its citizens were said to build as if they would live for ever and dine as if they would die tomorrow."},{id:"lutetia",name:"Lutetia",lat:48.85,lon:2.35,kind:"oppidum",region:"Gallia",desc:"The island stronghold of the Parisii on the Sequana. Caesar summoned the Gallic council here in 53 BC."},{id:"avaricum",name:"Avaricum",lat:47.08,lon:2.4,kind:"ruin",region:"Gallia",desc:"The finest town of the Bituriges. Caesar stormed it in 52 BC, and of forty thousand inside barely eight hundred escaped."},{id:"gergovia",name:"Gergovia",lat:45.71,lon:3.12,kind:"oppidum",region:"Gallia",desc:"The hilltop capital of the Arverni, where Vercingetorix handed Caesar his one clear defeat in Gaul."},{id:"genava",name:"Genava",lat:46.2,lon:6.15,kind:"town",region:"Gallia",desc:"A frontier town on the Rhone. In 58 BC Caesar broke its bridge to stop the Helvetii, and the Gallic War began."},{id:"vesontio",name:"Vesontio",lat:47.24,lon:6.02,kind:"oppidum",region:"Gallia",desc:"Stronghold of the Sequani in a loop of the river Dubis. Caesar's army nearly mutinied here for fear of the Germans."},{id:"durocortorum",name:"Durocortorum",lat:49.25,lon:4.03,kind:"oppidum",region:"Gallia",desc:"Capital of the Remi, the Belgic people who took Rome's side and never changed it."},{id:"itius",name:"Portus Itius",lat:50.73,lon:1.75,kind:"camp",port:1,region:"Gallia",desc:"The harbour where Caesar gathered eight hundred ships for his second crossing to Britain in 54 BC."},{id:"atuatuca",name:"Atuatuca",lat:50.78,lon:5.47,kind:"ruin",region:"Gallia",desc:"A winter camp where, in 54 BC, Ambiorix of the Eburones lured out and destroyed a legion and a half."},{id:"burdigala",name:"Burdigala",lat:44.84,lon:-.58,kind:"town",port:1,region:"Gallia",desc:"A trading post of the Bituriges Vivisci on the Garumna, where British tin comes south."},{id:"tolosa",name:"Tolosa",lat:43.6,lon:1.44,kind:"town",region:"Gallia",desc:'A town of the Tectosages. A consul who looted its sacred gold in 106 BC came to so bad an end that "Tolosan gold" became a proverb.'},{id:"dubris",name:"Dubris",lat:51.13,lon:1.31,kind:"camp",port:1,region:"Britannia",desc:"The white cliffs where Caesar first tried to land in 55 BC, and found them lined with warriors and chariots."},{id:"cassivellaunus",name:"Oppidum Cassivellauni",lat:51.8,lon:-.3,kind:"oppidum",region:"Britannia",desc:"The forest stronghold of the war leader Cassivellaunus, north of the Tamesis. Caesar took it in 54 BC, then went home and never returned."},{id:"pons",name:"Pons Caesaris",lat:50.42,lon:7.5,kind:"site",region:"Germania",desc:"In 55 BC Caesar bridged the Rhine here in ten days, marched about for eighteen, then crossed back and broke the bridge behind him."},{id:"noreia",name:"Noreia",lat:46.75,lon:14.4,kind:"oppidum",region:"Noricum",desc:"Seat of the Celtic kingdom of Noricum, famed for iron that makes the best sword blades in the world."},{id:"sarmizegetusa",name:"Sarmizegetusa",lat:45.62,lon:23.31,kind:"oppidum",region:"Dacia",desc:"The mountain sanctuary of the Dacians. Their king Burebista has built an empire on the Danube, and Caesar plans a war against him."},{id:"emporiae",name:"Emporiae",lat:42.13,lon:3.12,kind:"town",port:1,style:"greek",region:"Hispania",desc:'A Greek trading town whose name simply means "markets". Rome first set foot in Spain here in 218 BC.'},{id:"saguntum",name:"Saguntum",lat:39.68,lon:-.28,kind:"town",region:"Hispania",desc:"Hannibal's siege of this Roman ally in 219 BC started the Second Punic War."},{id:"numantia",name:"Numantia",lat:41.81,lon:-2.44,kind:"ruin",region:"Hispania",desc:"A Celtiberian hill town that defied Rome for twenty years. Scipio starved it out in 133 BC, and most of its people chose death over surrender."},{id:"olisipo",name:"Olisipo",lat:38.72,lon:-9.14,kind:"town",port:1,region:"Hispania",desc:"A harbour at the mouth of the Tagus on the edge of the Ocean, said by its people to have been founded by Ulysses."},{id:"brigantium",name:"Brigantium",lat:43.37,lon:-8.4,kind:"town",port:1,region:"Hispania",desc:"The far north-west corner of Spain. Caesar sailed here as governor in 61 BC, the first Roman fleet its people had ever seen."},{id:"tingis",name:"Tingis",lat:35.78,lon:-5.81,kind:"town",port:1,style:"punic",region:"Mauretania",desc:"A town of the kings of Mauretania opposite Spain, where the giant Antaeus was said to be buried."},{id:"cirta",name:"Cirta",lat:36.37,lon:6.61,kind:"city",style:"punic",region:"Numidia",desc:"The rock-girt capital of Numidia. King Juba rules from here, allied with Pompey's party and fond of ordering Romans about."},{id:"hippo",name:"Hippo Regius",lat:36.9,lon:7.75,kind:"town",port:1,style:"punic",region:"Numidia",desc:'A royal harbour of the Numidian kings. Metellus Scipio died off this coast in 46 BC, saying only "The general is well."'},{id:"zama",name:"Zama",lat:36.1,lon:9.3,kind:"site",region:"Africa",desc:"Near here in 202 BC Scipio defeated Hannibal and ended the Second Punic War."},{id:"hadrumetum",name:"Hadrumetum",lat:35.83,lon:10.64,kind:"town",port:1,style:"punic",region:"Africa",desc:'Where Caesar landed in Africa in 47 BC. He tripped coming ashore, and turned the bad omen by gripping the sand: "Africa, I hold you."'},{id:"leptis",name:"Leptis Magna",lat:32.64,lon:14.29,kind:"city",port:1,style:"punic",region:"Africa",desc:"A Punic trading city on the Libyan coast. Caesar fined it three million pounds of olive oil a year for backing Juba."},{id:"paraetonium",name:"Paraetonium",lat:31.35,lon:27.24,kind:"town",port:1,style:"egypt",region:"Aegyptus",desc:"The western harbour of Egypt, where the desert road to the oracle of Ammon begins."},{id:"ammonium",name:"Ammonium",lat:29.2,lon:25.52,kind:"site",style:"egypt",region:"Aegyptus",desc:"The oasis oracle of Zeus Ammon. Alexander crossed the desert to ask it a question, and never told anyone the answer."},{id:"thebae",name:"Thebae",lat:25.72,lon:32.62,kind:"city",style:"egypt",region:"Aegyptus",desc:"Hundred-gated Thebes, with the largest temples in the world. It rose against the Ptolemies in 88 BC and was savagely punished."},{id:"syene",name:"Syene",lat:24.1,lon:32.9,kind:"town",style:"egypt",region:"Aegyptus",desc:"The last town of Egypt, at the first cataract of the Nile. Eratosthenes used a well here to measure the size of the Earth."},{id:"petra",name:"Petra",lat:30.33,lon:35.44,kind:"city",style:"east",region:"Arabia",desc:"The hidden capital of the Nabataean Arabs, grown rich on frankincense caravans. Its king sent cavalry to help Caesar at Alexandria."},{id:"damascus",name:"Damascus",lat:33.51,lon:36.29,kind:"city",style:"east",region:"Syria",desc:"An oasis city older than memory, taken for Rome by Pompey's officers in 64 BC."},{id:"palmyra",name:"Palmyra",lat:34.55,lon:38.27,kind:"town",style:"east",region:"Syria",desc:"A caravan town in the Syrian desert. When Antony raids it for plunder in 41 BC, its people simply carry their goods across the Euphrates."},{id:"zeugma",name:"Zeugma",lat:37.06,lon:37.87,kind:"town",style:"east",region:"Syria",desc:'The "bridge" over the Euphrates. Beyond the river lies the Parthian empire.'},{id:"carrhae",name:"Carrhae",lat:36.86,lon:39.03,kind:"site",region:"Mesopotamia",desc:"Here in 53 BC Parthian horse archers destroyed the army of Crassus and carried off seven legionary eagles. Rome has not yet avenged it."},{id:"salamis",name:"Salamis",lat:35.18,lon:33.9,kind:"town",port:1,style:"greek",region:"Cyprus",desc:"Chief city of Cyprus. Marcus Brutus, the future assassin, lent it money at forty-eight per cent interest."},{id:"halicarnassus",name:"Halicarnassus",lat:37.04,lon:27.42,kind:"town",port:1,style:"greek",region:"Asia",desc:"Home of the Mausoleum, the tomb of King Mausolus and one of the seven wonders."},{id:"pergamum",name:"Pergamum",lat:39.13,lon:27.18,kind:"city",style:"greek",region:"Asia",desc:"A royal city on a crag. Its last king left his whole kingdom to Rome in his will in 133 BC. Its library is second only to Alexandria's."},{id:"mytilene",name:"Mytilene",lat:39.1,lon:26.55,kind:"town",port:1,style:"greek",region:"Asia",desc:"Chief town of Lesbos. A twenty-year-old Caesar won the civic crown here for saving a fellow soldier's life."},{id:"ilium",name:"Ilium",lat:39.96,lon:26.24,kind:"ruin",style:"greek",region:"Asia",desc:"The site of Troy. The Julii claim descent from the Trojan prince Aeneas, and so from the goddess Venus."},{id:"nicomedia",name:"Nicomedia",lat:40.77,lon:29.92,kind:"city",port:1,style:"greek",region:"Bithynia",desc:"Capital of Bithynia. The young Caesar stayed so long at King Nicomedes' court that his enemies never let him forget it."},{id:"sinope",name:"Sinope",lat:42.03,lon:35.15,kind:"city",port:1,style:"greek",region:"Pontus",desc:"Birthplace and capital of Mithridates the Great, who fought Rome for forty years."},{id:"trapezus",name:"Trapezus",lat:41,lon:39.72,kind:"town",port:1,style:"greek",region:"Pontus",desc:`Where Xenophon's Ten Thousand finally saw the sea and shouted "Thalatta! Thalatta!"`},{id:"panticapaeum",name:"Panticapaeum",lat:45.35,lon:36.47,kind:"town",port:1,style:"greek",region:"Bosporus",desc:"Capital of the Bosporan kingdom. Mithridates died here, and his son Pharnaces set out from here to win back Pontus."},{id:"chersonesus",name:"Chersonesus",lat:44.61,lon:33.49,kind:"town",port:1,style:"greek",region:"Bosporus",desc:"A Greek colony on the Tauric peninsula that ships grain across the Euxine."},{id:"tomis",name:"Tomis",lat:44.18,lon:28.65,kind:"town",port:1,style:"greek",region:"Thracia",desc:"A bleak harbour on the Euxine. Fifty years from now the poet Ovid will be exiled here and hate every day of it."},{id:"philippi",name:"Philippi",lat:41.01,lon:24.29,kind:"town",style:"greek",region:"Graecia",desc:"A town on the Via Egnatia beside a marshy plain. In 42 BC Brutus and Cassius will make their last stand here."},{id:"delphi",name:"Delphi",lat:38.48,lon:22.5,kind:"site",style:"greek",region:"Graecia",desc:"The oracle of Apollo, where the Pythia speaks for the god. The Greeks held it to be the navel of the world."},{id:"olympia",name:"Olympia",lat:37.64,lon:21.63,kind:"site",style:"greek",region:"Graecia",desc:"Home of the Olympic games, held every four years sin 622,size:.68},ursus:{name:"Bear",hp:340,dmg:26,spd:6.4,xp:260,den:[0,0],beast:1,elite:1,boss:1,coat:4862498,dark:2759698,size:.9,wide:1.5},aper:{name:"Great Boar",hp:230,dmg:21,spd:8.2,xp:200,den:[0,0],beast:1,elite:1,boss:1,coat:3943974,dark:1971730,size:.62,wide:1.35},leo:{name:"Lion",hp:280,dmg:24,spd:8.8,xp:260,den:[0,0],beast:1,elite:1,boss:1,coat:12095562,dark:8018474,size:.78,wide:1.15},panthera:{name:"Panther",hp:210,dmg:22,spd:9.6,xp:220,den:[0,0],beast:1,elite:1,boss:1,coat:12884558,dark:2760728,size:.66},labienus:{name:"Titus Labienus",hp:520,dmg:24,spd:5,xp:400,den:[120,120],guard:.5,elite:1,boss:1,look:{tunic:3099258,armor:"musculata",helmet:"attic",crest:"red",cloak:3099258,weapon:"gladius",shield:"scutum",shieldCol:3099258,scale:1.15}},achillas:{name:"Achillas",hp:300,dmg:20,spd:5,xp:220,den:[80,80],guard:.4,elite:1,boss:1,look:{tunic:15260864,armor:"squamata",helmet:"attic",crest:"red",cloak:1731178,weapon:"kopis",shield:"aspis",skin:12093018,scale:1.12}}},$h={Italia:["latro","latro","lupus"],Sicilia:["latro","pirata"],Sardinia:["latro","pirata"],Gallia:["gallus","lupus","latro"],Hispania:["iber","latro","lupus"],Africa:["numida","latro"],Aegyptus:["latro","numida"],Graecia:["latro","sagittarius","lupus"],Creta:["sagittarius","pirata"],Asia:["latro","pirata"],Thracia:["latro","lupus"],Cilicia:["pirata","latro"],Syria:["latro","numida"],Iudaea:["latro"],Pontus:["ponticus","lupus"],Britannia:["gallus","lupus"],Germania:["gallus","lupus"],Noricum:["gallus","lupus"],Dacia:["gallus","lupus"],Mauretania:["numida"],Numidia:["numida","latro"],Arabia:["latro","numida"],Mesopotamia:["ponticus"],Cyprus:["pirata"],Bithynia:["latro","pirata"],Bosporus:["ponticus","lupus"]},lf=[[43.6,11.4,2,"parma",60],[41.25,15.5,3,null,110],[38.6,16.3,4,"montefortino",90],[37.6,14,5,null,160],[44.3,5.9,5,"agen",100],[45.9,2.2,6,null,200],[40.4,-1.2,6,"coolus",120],[38.6,-3.4,7,null,240],[36.2,8.6,7,"squamata",150],[32.3,20.6,8,null,280],[30.9,28.2,8,"aspis",180],[39.6,21.2,6,"linothorax",120],[41.6,24.6,7,null,240],[37.6,29.6,8,null,260],[35.2,36.4,9,null,320],[38.9,33.4,9,"scutum",200]],en="Caesar",rs="Antonius",yv="You",zi=[{id:"m1",main:1,name:"The Die Is Cast",date:"January, 49 BC",lvl:1,reward:{xp:80,den:40},steps:[{t:"talk",npc:"caesar",at:"ravenna",obj:"Report to Caesar in Ravenna",give:{items:["gladius"]},say:[[en,"So you are the speculator the Thirteenth speaks of. Good. I need a rider who can keep his mouth shut."],[en,"The Senate has passed its final decree against me. Lay down my command, they say, or be named an enemy of Rome. The tribunes who spoke for me have been driven from the city."],[en,"Nine years I gave them in Gaul. If I go home as a private citizen, my enemies will have me in court within the month."],[en,"Take this sword, it is better than that dagger. Go south to the Rubicon and wait at the ford. I will come after dark."]]},{t:"goto",at:"rubico",r:16,obj:"Go south to the ford on the Rubicon",say:[["","The river is narrow enough to wade. On the far bank lies Italy, where no governor may lead an army."],[en,"We can still turn back. Once we cross that little bridge, everything must be settled by the sword."],[en,"Let the die be cast."],["",'Suetonius gives the words as "Iacta alea est". Plutarch says Caesar spoke them in Greek, quoting the playwright Menander.']]},{t:"kill",at:"rubico",off:[18,46],lvl:1,foes:[["latro",3]],obj:"Clear the bandits watching the road to Ariminum",say:[["","Men with clubs step out of the reeds. Civil war is good weather for robbers."]]},{t:"talk",npc:"antonius",at:"ariminum",obj:"Find Marcus Antonius in Ariminum",give:{horse:1},say:[[rs,"Caesar's rider? You took your time. I left Rome dressed as a slave in a hired cart, so do not expect me to be cheerful."],[rs,"They threatened a tribune of the plebs on the floor of the Senate. A tribune! Caesar could not have asked for a better grievance."],[rs,"Ariminum opened its gates without a blow. Now we move fast, before Pompeius can gather his legions."],[rs,"You will need a horse. Take the bay from the courier stable. Ride the Via Flaminia to Rome and see what is waiting for us there."]]}]},{id:"m2",main:1,name:"A City Abandoned",date:"February to March, 49 BC",lvl:2,reward:{xp:160,den:80},steps:[{t:"goto",at:"roma",r:40,obj:"Ride the Via Flaminia to Rome",say:[["","The Forum is half empty. Pompeius declared that anyone who stayed in Rome would be treated as Caesar's friend, then left with both consuls."],["","In their hurry they forgot the state treasury in the Temple of Saturn. Caesar will not forget it."]]},{t:"talk",npc:"cicero",at:"capua",obj:"Carry Caesar's letter to Cicero at Capua",say:[["Cicero",'From Caesar? He writes charmingly. He always has. "Stay out of it," he says, "and remain my friend."'],["Cicero","Pompeius has the better cause and the worse plan. Caesar has no cause at all and never makes a mistake. What is an honest man to do?"],[yv,"Caesar asks only that you stay neutral."],["Cicero","Neutral. Tell him I know whom to flee, but not whom to follow. Pompeius is marching for Brundisium and the ships. If you want to see the end of the Republic, ride the Appian Way."]]},{t:"kill",at:"brundisium",off:[-46,-40],lvl:3,foes:[["miles",3],["sagittarius",1]],obj:"Break through Pompey's rearguard at Brundisium",say:[["","Pompeius has walled up the streets and dug pits behind him. A rearguard holds the road while the last ships load."]],after:[["","Too late. The transports are standing out to sea, and Caesar has no fleet to chase them."]]},{t:"talk",npc:"caesar",at:"brundisium",obj:"Report to Caesar in Brundisium",give:{ship:1,items:["hamata"]},say:[[en,"Sixty days, and all Italy is mine without a battle. Yet Pompeius still has the fleet, the East, and seven legions in Spain."],[en,"I cannot follow him without ships. So I go to Spain first, to fight an army without a general. Afterwards I will deal with the general without an army."],[en,"I have requisitioned a liburnian galley for my dispatches. She is yours. Put on a mail shirt, and sail for Massilia. Decimus Brutus commands my ships there."]]}]},{id:"m3",main:1,name:"An Army Without a General",date:"April to August, 49 BC",lvl:4,reward:{xp:260,den:140},steps:[{t:"talk",npc:"decimus",at:"massilia",off:[-70,30],obj:"Sail to Massilia and find Decimus Brutus",say:[["Decimus","Dispatches from Caesar? Welcome to the siege. Massilia swore it was neutral, then let Domitius Ahenobarbus sail in and take command."],["Decimus","I built twelve ships at Arelate in thirty days, from green timber. They handle like barges. But my marines are picked men from the legions, and when we grapple, we win."],["Decimus","Their raiders sortie at dusk to burn our siege works. Help my men hold the ramp, and I will see that Caesar hears of it."]]},{t:"kill",at:"massilia",off:[-90,10],lvl:4,foes:[["miles",2],["sagittarius",2],["pirata",2]],obj:"Drive off the Massiliot raiders",after:[["Decimus","Well fought. Caesar is in Spain, near Ilerda. Take the Via Domitia over the Pyrenees."]]},{t:"kill",at:"ilerda",off:[40,46],lvl:5,foes:[["miles",4],["centurio",1]],obj:"At Ilerda, stop the Pompeian water carriers reaching the river",say:[["","Caesar has dug a trench between the enemy and the river Sicoris. Thirst will do what swords need not. A column tries to force its way to the water."]]},{t:"talk",npc:"caesar",at:"ilerda",obj:"Report to Caesar at Ilerda",give:{items:["coolus"]},say:[[en,"Afranius and Petreius have surrendered. Five legions, and I did not have to slaughter them."],[en,"I have sent every man home unharmed. Let Pompeius' friends call it weakness. Mercy is a new way of conquering."],[en,"Spain is settled. Now for the general. Sail to Epirus, to my camp south of Dyrrachium. Antonius is bringing the rest of the army across the Adriatic."]]}]},{id:"m4",main:1,name:"A General Without an Army",date:"January to August, 48 BC",lvl:6,reward:{xp:420,den:220},steps:[{t:"talk",npc:"antonius",at:"castra",obj:"Sail to Epirus and find Antonius at Caesar's camp",say:[[rs,"You made it past Bibulus' blockade? He sleeps on his flagship in midwinter to keep us out. The man hates Caesar more than he loves living."],[rs,"We have Pompeius penned against the sea with seventeen miles of earthworks. It is madness. He has more men inside than we have outside, and his fleet feeds him while we eat roots."],[rs,"Two Gallic deserters have shown him the unfinished stretch by the shore. He is coming through tonight. Get to the south wall."]]},{t:"kill",at:"castra",off:[-36,50],lvl:6,foes:[["miles",4],["sagittarius",2],["centurio",1]],obj:"Hold the breach in the siege line",after:[["","You hold your stretch of wall, but the line breaks elsewhere and the army runs. Nearly a thousand men and thirty-two standards are lost."],[en,"Today the victory would have been theirs, if they had a general who knew how to win."],[en,"We march inland to Thessaly. Pompeius will follow. His senators will give him no peace until he fights."]]},{t:"talk",npc:"crastinus",at:"pharsalus",obj:"Ride to the plain of Pharsalus",say:[["Crastinus","Gaius Crastinus, lately first spear of the Tenth. I came back as a volunteer for this one battle."],["Crastinus","Pompeius has twice our infantry and seven times our horse. Labienus leads the cavalry. He was Caesar's right hand in Gaul, and now he has sworn not to return to camp except as victor."],["Crastinus","Caesar has hidden a fourth line behind our right, with orders to thrust their javelins at the riders' faces. Follow me. I shall earn the general's thanks today, alive or dead."]]},{t:"kill",at:"pharsalus",off:[50,-44],lvl:7,foes:[["miles",5],["sagittarius",2],["centurio",2]],obj:"Fight in the front line at Pharsalus",after:[["","The cavalry breaks against the hidden cohorts and the whole Pompeian left folds. Crastinus dies in the first charge, a sword through the mouth. Caesar orders him a hero's burial."]]},{t:"talk",npc:"caesar",at:"pharsalus",obj:"Find Caesar in the captured camp",give:{items:["scutum13"]},say:[[en,"Look at their tents. Tables laid with silver, floors of fresh turf, ivy on the poles. They were dividing my offices among themselves last night."],[en,"They would have it so. After all I had done, I, Gaius Caesar, would have been condemned if I had not asked my army for help."],[en,"Pompeius rode off before the camp fell. He will run to Egypt, where the boy king owes him a throne. Take your ship to Alexandria. I follow with the galleys."]]}]},{id:"m5",main:1,name:"The Nile",date:"October, 48 BC to March, 47 BC",lvl:8,reward:{xp:600,den:300},steps:[{t:"talk",npc:"caesar",at:"alexandria",off:[20,-10],obj:"Sail to Alexandria",say:[["","You arrive to find Caesar already in the royal quarter, his face grey."],[en,"They brought me his head. Pompeius Magnus, three times a triumphator, stabbed in a rowing boat off Pelusium by a Roman who once served under him. They thought it would please me."],[en,"I turned away. I kept only his signet ring, a lion holding a sword. He was my enemy. He was also my son-in-law, and a Roman."],[en,"The boy Ptolemy and his sister are at war over the throne. I mean to settle it, and to collect what their father owed me. Go to the harbour. A Sicilian named Apollodorus has a delivery for the palace."]]},{t:"talk",npc:"apollodorus",at:"alexandria",off:[-52,34],obj:"Meet Apollodorus by the harbour at Alexandria",say:[["Apollodorus","Quietly, Roman. The king's soldiers watch every gate, and my mistress has been shut out of her own city."],["Apollodorus","So she comes in as baggage. A sack for bedclothes, tied with a strap, and me to carry it over my shoulder past the guards."],["","Plutarch tells the story this way, with a bedding sack. The rolled carpet is a later invention."]]},{t:"talk",npc:"cleopatra",at:"alexandria",off:[26,-18],obj:"Go to the palace",say:[["Cleopatra","So this is how Caesar's messengers look. Stand up straight. I have just been carried through my own gate like laundry, and I still have better posture."],["Cleopatra","I am the first of my house in three hundred years to learn the Egyptian tongue. I speak nine languages. My brother speaks through his eunuch."],["Cleopatra","That eunuch, Pothinus, has sent for the army. Twenty thousand men under Achillas, many of them Roman soldiers who stayed here and forgot they were Roman. They will be at the palace by nightfall."]]},{t:"kill",at:"alexandria",off:[-18,44],lvl:8,foes:[["aegyptius",5],["sagittarius",2]],obj:"Defend the palace quarter",say:[["","Caesar orders the ships in the harbour burned to keep them from Achillas. The fire leaps to the dockside warehouses, and scrolls stored for the Library burn with them."]]},{t:"kill",at:"alexandria",off:[-78,-30],lvl:9,foes:[["aegyptius",4],["achillas",1]],obj:"Seize the causeway to the Pharos",say:[["","Who holds the lighthouse island holds the harbour mouth. The fight for the causeway goes badly, and Caesar has to swim for it, holding his papers above the water in one hand."]]},{t:"talk",npc:"caesar",at:"alexandria",off:[20,-10],obj:"Return to Caesar",give:{items:["squamata"]},say:[[en,"The relief army has come through Pelusium. The king's forces broke on the Nile, and the boy drowned in his golden armour when his boat capsized."],[en,"Cleopatra reigns, with her youngest brother beside her for form's sake. Egypt will pay its debts."],[en,"I have stayed too long. Pharnaces of Pontus has overrun Asia Minor, and the Pompeians are gathering in Africa. Meet me at Tarsus in Cilicia."]]}]},{id:"m6",main:1,name:"Veni, Vidi, Vici",date:"August, 47 BC to April, 46 BC",lvl:10,reward:{xp:800,den:380},steps:[{t:"goto",at:"tarsus",r:34,obj:"Sail to Tarsus in Cilicia",say:[["","Caesar has already held his assembly here and marched north. Pharnaces, son of the great Mithridates, is camped at Zela in Pontus."]]},{t:"kill",at:"zela",off:[44,40],lvl:10,foes:[["ponticus",6],["sagittarius",2]],obj:"Ride north to Zela and join the battle",say:[["","Pharnaces does something no one expects. He charges uphill at the Roman camp while the legions are still digging."]]},{t:"talk",npc:"caesar",at:"zela",obj:"Speak with Caesar at Zela",say:[[en,"Four hours. Five days after I arrived. Pompeius made his name beating such armies."],[en,"Take a letter to my friend Matius in Rome. It need only say three words: Veni, vidi, vici."],[en,"But first, Africa. Scipio and Cato have ten legions there, and King Juba brings elephants. Meet my fleet at Thapsus."]]},{t:"kill",at:"thapsus",off:[-44,-42],lvl:11,foes:[["numida",4],["miles",4],["centurio",1]],obj:"Sail to Thapsus and fight in the line",say:[["",'The veterans do not wait for orders. A trumpeter of the Tenth sounds the charge on his own, and Caesar gives the word "Good fortune" and rides with them. Slingers turn the elephants back on their own army.']]},{t:"goto",at:"utica",r:34,obj:"Ride to Utica",say:[["","The town is in mourning. Cato read Plato's dialogue on the soul twice through, asked for his sword, and died by his own hand rather than owe his life to Caesar."],[en,"Cato, I grudge you your death, as you grudged me the chance to spare you."],["","The Republic's last armies gather in Spain under Pompey's sons and Labienus."]]}]},{id:"m7",main:1,name:"For His Life",date:"March, 45 BC",lvl:12,reward:{xp:1e3,den:450,items:["decima"]},steps:[{t:"talk",npc:"centurion",at:"munda",obj:"Travel to Caesar's camp before Munda",say:[["Centurion","Thirteen legions on that ridge under young Gnaeus Pompeius, and they hold the high ground. We must attack uphill."],["Centurion","Labienus is with them. He knows every trick Caesar has, because he helped invent half of them."],["Centurion",'The password today is "Venus". Stay close to the Tenth on the right.']]},{t:"kill",at:"munda",off:[46,44],lvl:12,foes:[["miles",5],["iber",3],["centurio",2]],obj:"Fight up the slope at Munda",say:[["",'The line wavers. Caesar snatches a shield, runs out ahead of the standards and shouts at his men: "Are you going to hand me over to these boys?"']]},{t:"kill",at:"munda",off:[70,70],lvl:13,foes:[["labienus",1],["miles",3]],obj:"Face Titus Labienus",say:[["Labienus","Caesar's errand boy. I conquered Gaul while he wrote the book about it. Come, then."]],after:[["","Labienus falls, and thirty thousand with him. Caesar grants his old lieutenant an honourable burial."],[en,"I have often fought for victory. Today, for the first time, I fought for my life."],[en,"It is finished. Come to Rome. There is a great deal to put in order, and not much time."]]}]},{id:"m8",main:1,name:"The Ides of March",date:"March, 44 BC",lvl:13,reward:{xp:1500,den:600,items:["musculata","attic"]},steps:[{t:"talk",npc:"caesar",at:"roma",off:[6,14],obj:"Return to Rome and find Caesar in the Forum",say:[[en,"There you are. I have reformed the calendar, did you hear? Three hundred and sixty-five days, and a leap day every fourth year. Sosigenes of Alexandria did the sums."],[en,"They have named me dictator for life. They vote me honours faster than I can refuse them, and resent me for each one."],[en,"In three days I leave for Parthia, to bring back the eagles Crassus lost. I have dismissed my Spanish bodyguard. It is better to die once than to live always in fear of death."],[en,"Go and rest. The Senate meets on the Ides in Pompeius' theatre."]]},{t:"talk",npc:"artemidorus",at:"roma",off:[-30,-26],obj:"A Greek teacher is asking for you near the Forum",say:[["Artemidorus","You are Caesar's man? Thank the gods. I teach Greek in the house of Brutus, and I hear things."],["Artemidorus","There are sixty of them. Cassius, Casca, Trebonius, Marcus Brutus. And Decimus Brutus, who dines at Caesar's table and is named in his will."],["Artemidorus","I have written it all in this scroll. He must read it himself, at once, alone. Go to his house before he leaves for the Senate."]]},{t:"talk",npc:"calpurnia",at:"roma",off:[34,20],obj:"Hurry to Caesar's house",say:[["Calpurnia","You have missed him. I begged him to stay. I dreamed I held him in my arms, covered in wounds, and the soothsayer found no heart in the sacrifice."],["Calpurnia","He had agreed to send word that he was unwell. Then Decimus Brutus came, laughing, and asked what the Senate would say if told to come back when Calpurnia has better dreams."],["Calpurnia","Decimus led him out by the hand. Run. The Senate meets at the theatre of Pompeius."]]},{t:"goto",at:"roma",off:[-44,30],r:12,obj:"Run to the Theatre of Pompey",say:[["","You push through the crowd as the litter sets down. Artemidorus is there before you and presses the scroll into Caesar's own hand."],["","Caesar tries several times to read it, but petitioners crowd around him. He is still holding it, unread, when he goes in."],["","Trebonius keeps Antonius talking at the door. Inside, Tillius Cimber pulls the toga from Caesar's shoulder. That is the signal."],["","Twenty-three wounds. He falls at the foot of Pompey's statue, having drawn his toga over his face."]]},{t:"kill",at:"roma",off:[-30,44],lvl:14,foes:[["gladiator",6]],obj:"Fight your way clear of Decimus Brutus' gladiators",say:[["","The killers march to the Capitol behind a troop of gladiators Decimus had waiting near the theatre. They take you for one of Antonius' men."]]},{t:"talk",npc:"antonius",at:"roma",off:[6,14],obj:"Find Antonius in the Forum",say:[[rs,"I read them his will. Three hundred sesterces to every citizen, and his gardens across the Tiber to the people. Then I held up the toga and showed them the holes."],[rs,"They are burning his body in the Forum itself, on a pyre of benches. Brutus and Cassius will not sleep in Rome tonight."],[rs,"One more thing was in that will. He adopted his sister's grandson and left him three quarters of everything. A boy of eighteen, studying in Apollonia. He is said to have landed near Brundisium."]]},{t:"talk",npc:"octavius",at:"brundisium",off:[12,16],obj:"Meet Caesar's heir at Brundisium",say:[["Octavius","You served my great-uncle from the Rubicon to the end. Then you know what was done to him, and by whom."],["Octavius","My mother writes that I should refuse the inheritance. My stepfather says the name will get me killed. The legions here have already hailed me by it."],["Octavius","I will take the name, and the debt that comes with it. From today I am Gaius Iulius Caesar."],["","Thirteen years of war lie ahead. When they end, the young man will be Augustus, and the Republic you were born in will be a memory."],["","Your part in the story is told. The whole Roman world is still yours to explore."]]}]},{id:"s_arena",name:"Blood and Sand",lvl:3,giver:{npc:"lanista",at:"capua",off:[30,-24]},reward:{xp:220,den:150,items:["sica"]},steps:[{t:"talk",npc:"lanista",at:"capua",off:[30,-24],obj:"Speak with the lanista in Capua",say:[["Scaurus","This school belongs to Caesar himself. Five thousand shields in the armoury, they say in Rome, as if it were a private army."],["Scaurus","With the master at war, the crowds are thin and my men are bored. You have a soldier's shoulders. Three bouts on the sand, wooden rules, real blades. Interested?"],["","Most gladiator fights did not end in death. A trained man was far too expensive to waste."]]},{t:"kill",at:"capua",off:[44,-34],lvl:3,foes:[["gladiator",1]],obj:"First bout: defeat the Thracian"},{t:"kill",at:"capua",off:[44,-34],lvl:4,foes:[["gladiator",2]],obj:"Second bout: defeat the pair"},{t:"kill",at:"capua",off:[44,-34],lvl:5,foes:[["gladiator",3]],obj:"Final bout: defeat three at once"},{t:"talk",npc:"lanista",at:"capua",off:[30,-24],obj:"Collect your winnings from Scaurus",say:[["Scaurus","The crowd will talk of that for a month. Your purse, and a Thracian's sica to remember us by."]]}]},{id:"s_grain",name:"The Grain Fleet",lvl:2,giver:{npc:"frumentarius",at:"ostia",off:[-10,14]},reward:{xp:150,den:120},steps:[{t:"talk",npc:"frumentarius",at:"ostia",off:[-10,14],obj:"Speak with the grain factor in Ostia",say:[["Quintus","Rome eats two hundred thousand tons of wheat a year, and every grain of it comes through this harbour."],["Quintus","Pompeius swept the pirates off the sea in three months, eighteen years ago. Now he has taken the fleet east, and the rats are back. A crew has beached down the coast with one of my barges."]]},{t:"kill",stealth:1,at:"ostia",off:[20,80],lvl:2,foes:[["pirata",4]],obj:"Deal with the pirates on the shore south of Ostia"},{t:"talk",npc:"frumentarius",at:"ostia",off:[-10,14],obj:"Return to Quintus",say:[["Quintus","The barge is back and the price of bread will hold another week. Rome has rioted over less. Here is your share."]]}]},{id:"s_appia",name:"Robbers on the Queen of Roads",lvl:3,giver:{npc:"viator",at:"brundisium",off:[-20,-22]},reward:{xp:200,den:130,items:["scutum"]},steps:[{t:"talk",npc:"viator",at:"brundisium",off:[-20,-22],obj:"Speak with the carter in Brundisium",say:[["Publius","Three hundred and sixty miles of fitted stone from here to Rome, and Appius Claudius built the first of it two and a half centuries ago. They call it the queen of roads."],["Publius","A queen with fleas. Deserters from both armies have made a camp in the hills past the fourth waystation and they stop every cart. They took my load, and a good legion shield I was carrying for my brother."]]},{t:"kill",stealth:1,at:[40.72,16.55],lvl:3,foes:[["latro",4],["miles",1]],obj:"Clear the deserters' camp beside the Via Appia"},{t:"talk",npc:"viator",at:"brundisium",off:[-20,-22],obj:"Return to Publius",say:[["Publius","My brother is dead at Dyrrachium, I heard this morning. Keep the shield. It should belong to someone who will use it."]]}]},{id:"s_tomb",name:"The Sphere and the Cylinder",lvl:4,giver:{npc:"scholar",at:"syracusae",off:[-16,20]},reward:{xp:260,den:100},steps:[{t:"talk",npc:"scholar",at:"syracusae",off:[-16,20],obj:"Speak with the geometer in Syracuse",say:[["Demetrios","Archimedes held off the Roman fleet for two years with his machines. When the city fell, a soldier cut him down over his diagrams."],["Demetrios","He asked for one thing on his tomb: a sphere inside a cylinder, for he had proved the one is exactly two thirds of the other."],["Demetrios","Cicero found the grave thirty years ago, choked with brambles, when our own magistrates denied it existed. They have let it vanish again. It lies outside the gate toward Agrigentum. Will you look?"]]},{t:"find",at:"syracusae",off:[-84,-40],obj:"Search the thickets west of Syracuse for the tomb",say:[["","A small column rises above the thorns. On top, worn but clear: a sphere set inside a cylinder, and half a line of verse."]]},{t:"talk",npc:"scholar",at:"syracusae",off:[-16,20],obj:"Tell Demetrios what you found",say:[["Demetrios","Then it stands. The greatest mind of the Greeks, and a Roman soldier has to show us where he lies. I will have the brambles cut. Thank you."]]}]},{id:"s_carthage",name:"Delenda Est",lvl:6,giver:{npc:"antiquarian",at:"utica",off:[16,18]},reward:{xp:320,den:200},steps:[{t:"talk",npc:"antiquarian",at:"utica",off:[16,18],obj:"Speak with the old settler in Utica",say:[["Sittius","My grandfather watched Carthage burn for seventeen days. Old Cato ended every speech with it: Carthage must be destroyed. Well, it was."],["Sittius","The tale that the fields were sown with salt is nonsense, by the way. The land was parcelled out and farmed. I farm some of it."],["Sittius","Grave robbers are digging in the old sanctuary for Punic gold. There is a carved stone there with the sign of Tanit that I would see kept safe. Bring it to me."]]},{t:"kill",stealth:1,at:"carthago",off:[10,10],lvl:6,foes:[["latro",3],["numida",2]],obj:"Drive the grave robbers out of the ruins of Carthage"},{t:"find",at:"carthago",off:[-14,-8],obj:"Recover the stele of Tanit from the sanctuary",say:[["","A limestone slab with a triangle, a bar and a circle: the goddess of a city that once ruled the western sea."]]},{t:"talk",npc:"antiquarian",at:"utica",off:[16,18],obj:"Bring the stele to Sittius",say:[["Sittius","Caesar means to plant a colony there, I hear. Roman houses on Punic foundations. Someone should remember what lay underneath."]]}]},{id:"s_vercingetorix",name:"The King in the Dark",lvl:5,giver:{npc:"brennos",at:"bibracte",off:[10,14]},reward:{xp:300,den:120},steps:[{t:"talk",npc:"brennos",at:"bibracte",off:[10,14],obj:"Speak with the Aeduan elder at Bibracte",say:[["Brennos","In this town all Gaul chose Vercingetorix of the Arverni to lead it. One summer later he rode out of Alesia in his best armour, circled Caesar's chair, and threw down his weapons at his feet."],["Brennos","That was three years ago. He sits in a pit under your Capitol, waiting to be walked in Caesar's triumph and strangled after."],["Brennos","We fought beside him, and we fought against him. Carry this torc to his keeper. Let him know that Gaul has not forgotten his name."]]},{t:"talk",npc:"jailer",at:"roma",off:[-16,-40],obj:"Take the torc to the Tullianum prison in Rome",say:[["Keeper","The Gaul? Twelve feet down, through a hole in the floor. Jugurtha of Numidia starved in the same cell."],["Keeper","He does not speak. He will be kept until Caesar has time for his triumph. I will lower the gold down to him. I promise nothing more."],["","Vercingetorix was held for six years and executed after Caesar's triumph in 46 BC."]]}]},{id:"s_rhodes",name:"Scrolls for Rhodes",lvl:7,giver:{npc:"cratippus",at:"athenae",off:[-14,22]},reward:{xp:380,den:220},steps:[{t:"talk",npc:"cratippus",at:"athenae",off:[-14,22],obj:"Speak with the philosopher in Athens",say:[["Cratippus","A Roman who listens! Usually they come to Athens to be seen listening. Cicero wants to send me his son, and I fear the boy prefers wine to Aristotle."],["Cratippus","I have copies of my lectures promised to the school at Rhodes. No captain will carry them while two Roman fleets hunt each other. You have a ship."]]},{t:"talk",npc:"rhetor",at:"rhodus",off:[14,16],obj:"Deliver the scrolls to the school of rhetoric at Rhodes",say:[["Menekles","From Cratippus? Excellent. Your Caesar studied in this very colonnade under Apollonius Molon. On the way here he was captured by pirates, joked that he would crucify them, and later did."],["Menekles","You will have seen our Colossus on the way in. A hundred feet of bronze, and it stood only fifty-four years before the earthquake. The oracle forbade us to raise it again, so there it lies. Few men can get their arms around the thumb."]]}]},{id:"s_library",name:"What the Fire Spared",lvl:9,req:"m5",giver:{npc:"librarian",at:"alexandria",off:[40,26]},reward:{xp:500,den:260,items:["aspis"]},steps:[{t:"talk",npc:"librarian",at:"alexandria",off:[40,26],obj:"Speak with the scholar near the Library",say:[["Sosigenes","Every ship that enters this harbour is searched for books. We copy them, keep the originals, and return the copies. That is how one builds the greatest library in the world."],["Sosigenes","The fire your general lit has burned the dockside stores. Some say forty thousand scrolls were in them, waiting to be shelved. A few crates were dragged clear. Find them before the looters do."]]},{t:"find",at:"alexandria",off:[-62,52],obj:"Search the burned warehouses for scroll crates",say:[["","A cedar crate, scorched on one side. Inside, wound tight in linen: works on the motion of the stars."]]},{t:"kill",stealth:1,at:"alexandria",off:[-84,30],lvl:9,foes:[["latro",4],["aegyptius",1]],obj:"Stop the looters at the next warehouse"},{t:"talk",npc:"librarian",at:"alexandria",off:[40,26],obj:"Return to Sosigenes",say:[["Sosigenes","Astronomy. Then I can finish the sums I owe your Caesar: a year of three hundred and sixty-five days and a quarter. Rome's calendar has drifted three months out of step with the sun."]]}]},{id:"s_gades",name:"The Statue of Alexander",lvl:10,giver:{npc:"priest",at:"gades",off:[-12,18]},reward:{xp:520,den:240,items:["falcata"]},steps:[{t:"talk",npc:"priest",at:"gades",off:[-12,18],obj:"Speak with the priest of Hercules at Gades",say:[["Priest","This temple is older than Rome. The Tyrians built it for Melqart, whom you call Hercules, when they first sailed through the Pillars."],["Priest","Twenty years ago a young quaestor stood before our statue of Alexander and wept. Alexander had conquered the world at his age, he said, and he had done nothing. His name was Caesar."],["Priest","Men who call themselves Pompeians have robbed the offerings and fled up the Corduba road. The god will reward whoever returns them."]]},{t:"kill",stealth:1,at:[36.95,-5.75],lvl:10,foes:[["iber",4],["miles",2]],obj:"Catch the temple robbers on the road to Corduba"},{t:"talk",npc:"priest",at:"gades",off:[-12,18],obj:"Return the offerings to the temple",say:[["Priest","The god is satisfied. Take this blade from the armoury, Iberian steel, buried in the ground for two years so that only the best of it survives."]]}]},{id:"s_pyramids",name:"Older Than Rome",lvl:8,giver:{npc:"guide",at:"memphis",off:[12,16]},reward:{xp:400,den:150},steps:[{t:"talk",npc:"guide",at:"memphis",off:[12,16],obj:"Speak with the guide in Memphis",say:[["Petosiris","Greek visitors have been coming to see them for four hundred years, and scratching their names on the stones. Herodotus was told a hundred thousand men built the great one."],["Petosiris","When your city was a few huts on a hill, they were already two thousand years old. Go and stand beneath them. Then tell me again about Roman greatness."]]},{t:"goto",at:"pyramides",r:30,obj:"Travel to the pyramids",say:[["","The casing stones still gleam white in the sun. The oldest of these tombs was built about 2560 BC, further in time from Caesar than Caesar is from the modern world."]]}]}],cf=[[43.35,11.2,2,"Castellum Umbrum","miles"],[41.6,14.9,3,"Castellum Samniticum","miles"],[39.3,16.4,4,"Arx Latronum","latro"],[37.75,14.35,5,"Praesidium Siculum","pirata"],[44.9,7.6,4,"Castellum Alpinum","gallus"],[46.2,3.9,6,"Dunum Arvernum","gallus"],[48.2,-.6,7,"Dunum Armoricum","gallus"],[50.3,3.2,8,"Castra Nerviorum","gallus"],[51.4,.6,9,"Dunum Cantiacum","gallus"],[42.3,-1.9,6,"Castellum Vas
