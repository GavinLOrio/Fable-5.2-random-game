<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Aquila</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D canvas; a thin HUD in the corners; every menu is one centred parchment panel over a dark scrim. */
:root {
  color-scheme: dark;
  --ink: #241a10;
  --ink2: #5c4a36;
  --parch: #efe3c8;
  --parch2: #e2d2ae;
  --line: #b89c6a;
  --red: #8c1d18;
  --red2: #b3302a;
  --gold: #d9ad4e;
  --night: #120d08;
  --hp: #c8372d;
  --stam: #6fae4a;
  --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --body: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  --sl: max(14px, env(safe-area-inset-left, 0px));
  --sr: max(14px, env(safe-area-inset-right, 0px));
  --st: max(10px, env(safe-area-inset-top, 0px));
  --sb: max(12px, env(safe-area-inset-bottom, 0px));
  --hs: 1;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--night); color: var(--parch); font: 500 16px/1.4 var(--body); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
#hud > * { position: absolute; }
#bars { top: var(--st); left: var(--sl); display: grid; grid-template-columns: auto 1fr; gap: 3px 9px; align-items: center; transform: scale(var(--hs)); transform-origin: top left; }
#lvl { grid-row: span 2; width: 40px; height: 40px; display: grid; place-items: center; font: 800 17px var(--display); color: var(--ink); background: radial-gradient(circle at 35% 30%, #f6e2a8, var(--gold) 60%, #9a7426); border-radius: 50%; box-shadow: 0 0 0 2px rgba(18, 13, 8, 0.8); text-shadow: none; }
.bar { width: clamp(120px, 20vw, 220px); height: 11px; background: rgba(18, 13, 8, 0.72); border: 1px solid rgba(217, 173, 78, 0.5); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--hp); transition: width 0.12s; }
.bar.st { height: 7px; } .bar.st i { background: var(--stam); }
#purse { grid-column: 1 / -1; font-size: 13.5px; font-weight: 700; color: var(--parch); display: flex; gap: 12px; }
#purse b { color: var(--gold); }
#compass { top: var(--st); left: 50%; transform: translateX(-50%); width: min(44vw, 380px); display: flex; flex-direction: column; align-items: center; gap: 2px; }
#compassCv { width: 100%; height: 26px; }
#objective { font-size: clamp(12.5px, 1.5vw, 15px); font-weight: 700; text-align: center; text-wrap: balance; max-width: 100%; }
#objective small { display: block; font: 600 10.5px var(--display); letter-spacing: 0.16em; color: var(--gold); text-transform: uppercase; }
#topbtns { top: var(--st); right: var(--sr); display: flex; gap: 7px; pointer-events: auto; transform: scale(var(--hs)); transform-origin: top right; }
.ib { width: 40px; height: 40px; border-radius: 9px; background: rgba(18, 13, 8, 0.66); border: 1px solid rgba(217, 173, 78, 0.55); display: grid; place-items: center; padding: 0; position: relative; }
.ib svg { width: 21px; height: 21px; fill: none; stroke: var(--parch); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ib em { position: absolute; right: -4px; top: -5px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--red2); font: 700 10px/15px var(--body); text-align: center; text-shadow: none; }
#prompt { left: 50%; bottom: calc(var(--sb) + 132px); transform: translateX(-50%); pointer-events: auto; display: flex; align-items: center; gap: 9px; padding: 8px 16px 8px 9px; border-radius: 999px; background: rgba(18, 13, 8, 0.78); border: 1px solid var(--gold); font-weight: 700; font-size: 15px; white-space: nowrap; }
#prompt b { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px; background: var(--gold); color: var(--ink); display: grid; place-items: center; font: 800 12px var(--display); text-shadow: none; }
body.touch #prompt b { display: none; } body.touch #prompt { padding: 11px 20px; bottom: calc(var(--sb) + 20px); }
#actions { right: var(--sr); bottom: var(--sb); width: 214px; height: 190px; pointer-events: none; transform: scale(var(--hs)); transform-origin: bottom right; }
.ab { position: absolute; pointer-events: auto; border-radius: 50%; background: rgba(18, 13, 8, 0.6); border: 1.5px solid rgba(217, 173, 78, 0.7); display: grid; place-items: center; padding: 0; touch-action: none; }
.ab svg { width: 46%; height: 46%; fill: none; stroke: var(--parch); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ab em { position: absolute; right: 0; top: -3px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--ink); border: 1px solid var(--gold); font: 700 11px/16px var(--body); text-align: center; }
.ab:active { background: rgba(217, 173, 78, 0.35); }
.ab.off { opacity: 0.32; }
#aAtk { width: 86px; height: 86px; right: 0; bottom: 0; border-color: var(--gold); } #aBlk { width: 62px; height: 62px; right: 96px; bottom: 2px; } #aDge { width: 62px; height: 62px; right: 70px; bottom: 76px; }
#aPil { width: 52px; height: 52px; right: 2px; bottom: 98px; } #aEat { width: 46px; height: 46px; right: 150px; bottom: 76px; } #aMnt { width: 46px; height: 46px; right: 166px; bottom: 10px; }
body:not(.touch) #actions { width: auto; height: auto; display: flex; gap: 6px; align-items: flex-end; }
body:not(.touch) .ab { position: relative; width: 40px !important; height: 40px !important; right: auto !important; bottom: auto !important; border-radius: 9px; }
body:not(.touch) .ab::after { content: attr(data-key); position: absolute; left: 50%; bottom: -15px; transform: translateX(-50%); font: 700 9.5px var(--display); letter-spacing: 0.08em; color: var(--parch); opacity: 0.8; white-space: nowrap; }
body:not(.touch) #actions { bottom: calc(var(--sb) + 14px); }
#toast { top: 21%; left: 50%; transform: translateX(-50%); width: min(92vw, 760px); text-align: center; opacity: 0; transition: opacity 0.5s; font: 800 clamp(22px, 4.4vw, 42px) var(--display); letter-spacing: 0.14em; color: var(--parch); text-shadow: 0 0 22px rgba(217, 173, 78, 0.5), 0 3px 10px #000; text-wrap: balance; }
#toast small { display: block; margin-top: 6px; font: 700 clamp(11px, 1.5vw, 14px) var(--body); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
#toast.on { opacity: 1; }
#notes { left: var(--sl); top: calc(var(--st) + 86px); max-width: min(46vw, 420px); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
#notes div { padding: 4px 10px; border-radius: 6px; background: rgba(18, 13, 8, 0.7); border-left: 3px solid var(--gold); font-size: 13.5px; font-weight: 700; animation: note 4s forwards; }
@keyframes note { 0% { opacity: 0; transform: translateX(-10px); } 8% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
#foe { top: calc(var(--st) + 64px); left: 50%; transform: translateX(-50%); width: min(60vw, 420px); text-align: center; font: 800 13px var(--display); letter-spacing: 0.12em; }
#foe .bar { width: 100%; height: 9px; margin-top: 3px; }
#fps { left: var(--sl); bottom: var(--sb); font-size: 11px; opacity: 0.8; }
#saved { right: var(--sr); top: calc(var(--st) + 50px); font: 700 11px var(--display); letter-spacing: 0.16em; color: var(--gold); opacity: 0; transition: opacity 0.4s; }
#saved.on { opacity: 1; }
#dmg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.dn { position: absolute; left: 0; top: 0; display: none; font: 700 16px var(--body); color: #fff; text-shadow: 0 1px 3px #000; will-change: transform; }
.dn.crit { font-size: 22px; color: var(--gold); } .dn.heal { color: #9be07a; } .dn.hurt { color: #ff6a5a; } .dn.xp { color: #9fd0ff; font-size: 13px; }
#grade { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(20, 12, 4, 0.34) 100%); }
#vignette, #fade { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
#vignette { background: radial-gradient(ellipse at center, transparent 45%, rgba(170, 20, 15, 0.65) 100%); }
#fade { background: #000; transition: opacity 0.35s; } #fade.on { opacity: 1; }
#joy { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.06); pointer-events: none; display: none; }
#joy.on { display: block; }
#joyknob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%; background: rgba(217, 173, 78, 0.6); transform: translate(-50%, -50%); }

/* ---------- dialogue ---------- */
#dialog { position: fixed; left: 50%; bottom: calc(var(--sb) + 10px); transform: translateX(-50%); width: min(94vw, 760px); padding: 14px 20px 12px; background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); cursor: pointer; }
#dname { font: 800 14px var(--display); letter-spacing: 0.1em; color: var(--red); margin-bottom: 3px; }
#dtext { font-size: clamp(15.5px, 1.9vw, 18.5px); line-height: 1.42; min-height: 2.8em; }
#dtext.narr { font-style: italic; color: var(--ink2); }
#dnext { text-align: right; font: 700 11px var(--display); letter-spacing: 0.16em; color: var(--ink2); margin-top: 4px; }

/* ---------- overlays ---------- */
.ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px; padding-block: var(--st) var(--sb); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(12, 8, 5, 0.72); overflow-y: auto; }
#title { background: linear-gradient(180deg, rgba(12, 8, 5, 0.5), rgba(12, 8, 5, 0.12) 45%, rgba(12, 8, 5, 0.82)); text-align: center; }
#title h1 { margin: 0; font: 800 clamp(48px, 12vw, 120px)/1 var(--display); letter-spacing: 0.16em; padding-left: 0.16em; color: var(--parch); text-shadow: 0 0 30px rgba(217, 173, 78, 0.55), 0 4px 16px #000; }
#title p { margin: 0; font: 700 clamp(11px, 1.7vw, 15px) var(--display); letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); text-shadow: 0 2px 8px #000; }
.col { display: flex; flex-direction: column; gap: 9px; align-items: stretch; width: min(100%, 300px); }
.btn { padding: 12px 22px; font: 800 14px var(--display); letter-spacing: 0.16em; text-transform: uppercase; border-radius: 6px; border: 1.5px solid #5e120f; background: linear-gradient(180deg, var(--red2), var(--red)); color: #fbeed0; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45); }
.btn:hover { filter: brightness(1.12); }
.btn.alt { background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border-color: var(--line); }
.btn.sm { padding: 7px 13px; font-size: 11.5px; letter-spacing: 0.1em; box-shadow: none; }
.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
.panel { width: min(100%, 720px); max-height: 100%; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; box-shadow: 0 16px 60px rgba(0, 0, 0, 0.7); overflow: hidden; }
.panel.narrow { width: min(100%, 400px); }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: rgba(140, 29, 24, 0.08); }
.phead h2 { margin: 0; font: 800 clamp(16px, 2.6vw, 21px) var(--display); letter-spacing: 0.12em; color: var(--red); }
.x { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--ink); font: 700 17px/1 var(--body); padding: 0; flex: none; }
.pbody { padding: 12px 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink2); font: 700 12px var(--display); letter-spacing: 0.08em; }
.tabs button.on { background: var(--red); border-color: var(--red); color: #fbeed0; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, 0.28); }
.row.on { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.row .tx { flex: 1; min-width: 0; }
.row .nm { font: 800 14.5px var(--display); letter-spacing: 0.04em; }
.row .ds { font-size: 14px; color: var(--ink2); line-height: 1.32; }
.row .stt { font-size: 13px; font-weight: 700; color: var(--red); }
.muted { color: var(--ink2); font-size: 14px; }
.sect { font: 800 11.5px var(--display); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink2); margin-top: 4px; }
.set { display: grid; grid-template-columns: 1fr minmax(120px, 46%); gap: 8px 14px; align-items: center; font-size: 15px; font-weight: 700; }
.set small { display: block; font-weight: 500; color: var(--ink2); font-size: 12.5px; line-height: 1.25; }
.set input[type=range] { width: 100%; accent-color: var(--red); }
.set select, .set input[type=text] { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1.5px solid var(--line); background: #f8f0dc; color: var(--ink); font: 600 14.5px var(--body); }
.set input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--red); justify-self: start; }
#mapscr { padding: 0; background: #1a2a30; }
#mapCv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#mapTop { position: absolute; top: var(--st); left: var(--sl); right: var(--sr); display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
#mapTop h2 { margin: 0; font: 800 clamp(15px, 2.4vw, 20px) var(--display); letter-spacing: 0.14em; color: var(--ink); background: rgba(239, 227, 200, 0.9); padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--line); }
#mapTop .x { pointer-events: auto; background: var(--parch); }
#mapCard { position: absolute; left: 50%; bottom: var(--sb); transform: translateX(-50%); width: min(94vw, 520px); padding: 12px 16px; background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 6px; }
#mapCard h3 { margin: 0; font: 800 17px var(--display); letter-spacing: 0.08em; color: var(--red); }
#mapCard h3 small { font: 700 11px var(--display); letter-spacing: 0.14em; color: var(--ink2); margin-left: 8px; }
#mapCard p { margin: 0; font-size: 14.5px; line-height: 1.35; }
#loading { background: var(--night); text-align: center; }
#loading h2 { margin: 0; font: 800 40px var(--display); letter-spacing: 0.2em; color: var(--parch); }
#loading p { margin: 0; letter-spacing: 0.28em; text-transform: uppercase; font-size: 12px; color: var(--gold); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14.5px; }
.keys b { font: 800 12px var(--display); letter-spacing: 0.06em; color: var(--red); white-space: nowrap; }
@media (max-width: 640px) and (orientation: portrait) {
  #compass { top: calc(var(--st) + 86px); width: 88vw; }
  #notes { top: calc(var(--st) + 190px); max-width: 88vw; }
  #foe { top: calc(var(--st) + 150px); width: 88vw; }
  #toast { top: 30%; }
  .set { grid-template-columns: 1fr; gap: 3px; }
}
@media (max-height: 480px) {
  #toast { top: 36%; font-size: 24px; }
  #notes { max-width: 30vw; } #notes div { font-size: 12px; }
  #foe { width: min(36vw, 420px); }
  #title h1 { font-size: 54px; } .ov { gap: 8px; } .btn { padding: 9px 18px; }
  #dialog { padding: 9px 14px 8px; } #dtext { font-size: 15px; min-height: 2.6em; }
  #mapCard p { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { #notes div { animation-duration: 4s; } #fade { transition: none; } }
</style>

</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="grade"></div>
<div id="hud" hidden>
  <div id="bars">
    <div id="lvl">1</div>
    <div class="bar hp"><i id="hpf"></i></div>
    <div class="bar st"><i id="stf"></i></div>
    <div id="purse"></div>
  </div>
  <div id="compass"><canvas id="compassCv" width="760" height="52"></canvas><div id="objective"></div></div>
  <div id="topbtns">
    <button class="ib" data-act="map" aria-label="Map"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg></button>
    <button class="ib" data-act="bag" aria-label="Gear"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M12 8v8M8.5 11h7"/></svg></button>
    <button class="ib" data-act="log" aria-label="Quests"><svg viewBox="0 0 24 24"><path d="M6 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V5a1 1 0 0 1 1-1zM9 9h6M9 13h6"/></svg><em id="logN" hidden></em></button>
    <button class="ib" data-act="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="notes"></div>
  <div id="foe" hidden><span id="foeName"></span><div class="bar"><i id="foeF"></i></div></div>
  <button id="prompt" data-act="interact" hidden><b>E</b><span id="promptT"></span></button>
  <div id="actions">
    <button class="ab" id="aMnt" data-act="mount" data-key="H" aria-label="Horse"><svg viewBox="0 0 24 24"><path d="M5 20v-6l-2-3 4-6 3 1 5-2 4 4-1 4-3 1v7M10 20v-5"/></svg></button>
    <button class="ab" id="aEat" data-act="eat" data-key="R" aria-label="Eat bread"><svg viewBox="0 0 24 24"><path d="M4 13a8 6 0 0 1 16 0v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM9 10v3M12 9v4M15 10v3"/></svg><em id="eatN">0</em></button>
    <button class="ab" id="aPil" data-act="pilum" data-key="F" aria-label="Throw pilum"><svg viewBox="0 0 24 24"><path d="M4 20L20 4M20 4l-5 1 4 4zM7 14l3 3"/></svg><em id="pilN">0</em></button>
    <button class="ab" id="aDge" data-act="dodge" data-key="SPACE" aria-label="Dodge"><svg viewBox="0 0 24 24"><path d="M5 6l6 6-6 6M12 6l6 6-6 6"/></svg></button>
    <button class="ab" id="aBlk" data-act="block" data-key="K" aria-label="Block"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9.5C7.500 20 4 17 4 12V6z"/></svg></button>
    <button class="ab" id="aAtk" data-act="attack" data-key="J" aria-label="Attack"><svg viewBox="0 0 24 24"><path d="M5 19L18 6l1-3-3 1L3 17zM7 13l4 4M4 20l2-2"/></svg></button>
  </div>
  <div id="toast"></div>
  <div id="saved">SAVED</div>
  <div id="fps" hidden></div>
</div>
<div id="dmg"></div>
<div id="vignette"></div>
<div id="joy"><div id="joyknob"></div></div>
<div id="dialog" hidden><div id="dname"></div><div id="dtext"></div><div id="dnext">CONTINUE</div></div>

<div class="ov" id="title" hidden>
  <h1>AQUILA</h1>
  <p>The Roman world, 49 BC</p>
  <div class="col" id="titleBtns"></div>
</div>
<div class="ov" id="panelOv" hidden><div class="panel" id="panel"><div class="phead"><h2 id="pTitle"></h2><button class="x" id="pClose" aria-label="Close">×</button></div><div class="pbody" id="pBody"></div></div></div>
<div class="ov" id="mapscr" hidden>
  <canvas id="mapCv"></canvas>
  <div id="mapTop"><h2>MARE NOSTRUM</h2><button class="x" id="mapClose" aria-label="Close map">×</button></div>
  <div id="mapCard" hidden></div>
</div>

 Cicero later found his forgotten tomb."},{id:"caralis",name:"Caralis",lat:39.22,lon:9.12,kind:"town",port:1,region:"Sardinia",desc:"Chief port of Sardinia, an old Punic harbour that sends grain to Rome."},{id:"massilia",name:"Massilia",lat:43.3,lon:5.37,kind:"city",port:1,style:"greek",region:"Gallia",desc:"A Greek colony founded about 600 BC and an old ally of Rome. In 49 BC it shut its gates to Caesar and endured a six-month siege."},{id:"narbo",name:"Narbo Martius",lat:43.18,lon:3,kind:"town",port:1,region:"Gallia",desc:"The first Roman colony in Gaul, founded in 118 BC on the Via Domitia, the road that links Italy to Hispania."},{id:"bibracte",name:"Bibracte",lat:46.92,lon:4.03,kind:"oppidum",region:"Gallia",desc:"Hilltop capital of the Aedui, Rome's oldest allies in Gaul. Caesar finished his commentaries on the Gallic War here in the winter of 52 BC."},{id:"alesia",name:"Alesia",lat:47.54,lon:4.5,kind:"ruin",region:"Gallia",desc:"Where Vercingetorix surrendered in 52 BC after Caesar ringed the hill with two lines of siege works, one facing in and one facing out."},{id:"tarraco",name:"Tarraco",lat:41.12,lon:1.25,kind:"city",port:1,region:"Hispania",desc:"Rome's main base in Nearer Spain since the Scipios landed here against Carthage."},{id:"ilerda",name:"Ilerda",lat:41.62,lon:.62,kind:"camp",region:"Hispania",desc:"In the summer of 49 BC Caesar outmarched Pompey's legates Afranius and Petreius here, cut them off from water and took their surrender almost without a battle."},{id:"carthago_nova",name:"Carthago Nova",lat:37.6,lon:-.98,kind:"city",port:1,style:"punic",region:"Hispania",desc:"Founded by Hasdrubal of Carthage and captured by Scipio in 209 BC. Its silver mines and harbour are the finest in Spain."},{id:"corduba",name:"Corduba",lat:37.88,lon:-4.78,kind:"city",region:"Hispania",desc:"Capital of Further Spain on the river Baetis."},{id:"munda",name:"Munda",lat:37.35,lon:-5.1,kind:"camp",region:"Hispania",desc:"Site of the last battle of the civil war, 17 March 45 BC. Caesar said that elsewhere he had fought for victory, but here for his life."},{id:"gades",name:"Gades",lat:36.53,lon:-6.29,kind:"city",port:1,style:"punic",region:"Hispania",desc:"An ancient Phoenician port beyond the Pillars of Hercules. As a young quaestor Caesar is said to have wept here before a statue of Alexander the Great."},{id:"utica",name:"Utica",lat:37.12,lon:9.9,kind:"city",port:1,style:"punic",region:"Africa",desc:"Capital of Roman Africa since Carthage fell. Cato the Younger held it for the Republic and took his own life here in 46 BC rather than accept Caesar's pardon."},{id:"carthago",name:"Carthago",lat:36.8,lon:10.42,kind:"ruin",style:"punic",region:"Africa",desc:"Destroyed by Scipio Aemilianus in 146 BC and still in ruins. Caesar plans a new colony on the site."},{id:"thapsus",name:"Thapsus",lat:35.62,lon:10.95,kind:"camp",port:1,region:"Africa",desc:"On 6 April 46 BC Caesar broke the army of Metellus Scipio and King Juba of Numidia here. The Fifth Legion earned its elephant emblem facing Juba's war elephants."},{id:"cyrene",name:"Cyrene",lat:32.82,lon:21.86,kind:"city",port:1,style:"greek",region:"Africa",desc:"A Greek city in Libya, grown rich on silphium, a medicinal plant found nowhere else."},{id:"alexandria",name:"Alexandria",lat:31.2,lon:29.92,kind:"urbs",port:1,style:"egypt",region:"Aegyptus",desc:"Founded by Alexander in 331 BC and ruled by the Ptolemies, a Macedonian dynasty. Its Pharos lighthouse and Library are wonders of the world."},{id:"pelusium",name:"Pelusium",lat:31.04,lon:32.55,kind:"town",port:1,style:"egypt",region:"Aegyptus",desc:"The eastern fortress of Egypt. Pompey the Great was murdered in a small boat off this shore on 28 September 48 BC."},{id:"memphis",name:"Memphis",lat:29.86,lon:31.25,kind:"town",style:"egypt",region:"Aegyptus",desc:"The ancient capital of the pharaohs, where the Ptolemies are still crowned in the old Egyptian manner."},{id:"pyramides",name:"Pyramides",lat:30.02,lon:30.95,kind:"pyramids",style:"egypt",region:"Aegyptus",desc:"The pyramids of Giza were already some 2,500 years old in Caesar's day, as distant from him as he is from us."},{id:"dyrrachium",name:"Dyrrachium",lat:41.32,lon:19.45,kind:"city",port:1,style:"greek",region:"Graecia",desc:"The landing place opposite Brundisium and the start of the Via Egnatia. Pompey made it his supply base in 48 BC."},{id:"castra",name:"Castra Caesaris",lat:41.05,lon:19.75,kind:"camp",region:"Graecia",desc:"Caesar tried to pen Pompey against the sea with seventeen miles of earthworks here. In July 48 BC Pompey broke the line and Caesar suffered his worst defeat."},{id:"apollonia",name:"Apollonia",lat:40.6,lon:19.6,kind:"town",style:"greek",region:"Graecia",desc:"A Greek city famous for its schools. Caesar's great-nephew Octavius was studying here when the dictator was killed."},{id:"pharsalus",name:"Pharsalus",lat:39.3,lon:22.38,kind:"camp",region:"Graecia",desc:"On 9 August 48 BC Caesar, outnumbered two to one, routed Pompey on this plain in Thessaly."},{id:"thessalonica",name:"Thessalonica",lat:40.64,lon:22.94,kind:"city",port:1,style:"greek",region:"Graecia",desc:"Capital of Roman Macedonia on the Via Egnatia. The senators who fled with Pompey met here as a Senate in exile."},{id:"athenae",name:"Athenae",lat:37.97,lon:23.73,kind:"city",port:1,style:"greek",region:"Graecia",desc:"No longer a power, but still the school of the world. Young Romans come to study philosophy beneath the Parthenon."},{id:"corinthus",name:"Corinthus",lat:37.9,lon:22.8,kind:"ruin",style:"greek",region:"Graecia",desc:"Sacked and levelled by Mummius in 146 BC, the same year as Carthage. Caesar will refound it as a colony in 44 BC."},{id:"cnossus",name:"Cnossus",lat:35.3,lon:25.16,kind:"town",port:1,style:"greek",region:"Creta",desc:"Old city of Crete, conquered by Metellus in 67 BC. Cretan archers serve as mercenaries in every army."},{id:"rhodus",name:"Rhodus",lat:36.44,lon:28.22,kind:"city",port:1,style:"greek",region:"Asia",desc: ta"],Sardinia:["latro","pirata"],Gallia:["gallus","lupus","latro"],Hispania:["iber","latro","lupus"],Africa:["numida","latro"],Aegyptus:["latro","numida"],Graecia:["latro","sagittarius","lupus"],Creta:["sagittarius","pirata"],Asia:["latro","pirata"],Thracia:["latro","lupus"],Cilicia:["pirata","latro"],Syria:["latro","numida"],Iudaea:["latro"],Pontus:["ponticus","lupus"]},wd=[[43.6,11.4,2,"parma",60],[41.25,15.5,3,null,110],[38.6,16.3,4,"montefortino",90],[37.6,14,5,null,160],[44.3,5.9,5,"agen",100],[45.9,2.2,6,null,200],[40.4,-1.2,6,"coolus",120],[38.6,-3.4,7,null,240],[36.2,8.6,7,"squamata",150],[32.3,20.6,8,null,280],[30.9,28.2,8,"aspis",180],[39.6,21.2,6,"linothorax",120],[41.6,24.6,7,null,240],[37.6,29.6,8,null,260],[35.2,36.4,9,null,320],[38.9,33.4,9,"scutum",200]],zt="Caesar",Ui="Antonius",Ex="You",bi=[{id:"m1",main:1,name:"The Die Is Cast",date:"January, 49 BC",lvl:1,reward:{xp:80,den:40},steps:[{t:"talk",npc:"caesar",at:"ravenna",obj:"Report to Caesar in Ravenna",give:{items:["gladius"]},say:[[zt,"So you are the speculator the Thirteenth speaks of. Good. I need a rider who can keep his mouth shut."],[zt,"The Senate has passed its final decree against me. Lay down my command, they say, or be named an enemy of Rome. The tribunes who spoke for me have been driven from the city."],[zt,"Nine years I gave them in Gaul. If I go home as a private citizen, my enemies will have me in court within the month."],[zt,"Take this sword, it is better than that dagger. Go south to the Rubicon and wait at the ford. I will come after dark."]]},{t:"goto",at:"rubico",r:16,obj:"Go south to the ford on the Rubicon",say:[["","The river is narrow enough to wade. On the far bank lies Italy, where no governor may lead an army."],[zt,"We can still turn back. Once we cross that little bridge, everything must be settled by the sword."],[zt,"Let the die be cast."],["",'Suetonius gives the words as "Iacta alea est". Plutarch says Caesar spoke them in Greek, quoting the playwright Menander.']]},{t:"kill",at:"rubico",off:[18,46],lvl:1,foes:[["latro",3]],obj:"Clear the bandits watching the road to Ariminum",say:[["","Men with clubs step out of the reeds. Civil war is good weather for robbers."]]},{t:"talk",npc:"antonius",at:"ariminum",obj:"Find Marcus Antonius in Ariminum",give:{horse:1},say:[[Ui,"Caesar's rider? You took your time. I left Rome dressed as a slave in a hired cart, so do not expect me to be cheerful."],[Ui,"They threatened a tribune of the plebs on the floor of the Senate. A tribune! Caesar could not have asked for a better grievance."],[Ui,"Ariminum opened its gates without a blow. Now we move fast, before Pompeius can gather his legions."],[Ui,"You will need a horse. Take the bay from the courier stable. Ride the Via Flaminia to Rome and see what is waiting for us there."]]}]},{id:"m2",main:1,name:"A City Abandoned",date:"February to March, 49 BC",lvl:2,reward:{xp:160,den:80},steps:[{t:"goto",at:"roma",r:40,obj:"Ride the Via Flaminia to Rome",say:[["","The Forum is half empty. Pompeius declared that anyone who stayed in Rome would be treated as Caesar's friend, then left with both consuls."],["","In their hurry they forgot the state treasury in the Temple of Saturn. Caesar will not forget it."]]},{t:"talk",npc:"cicero",at:"capua",obj:"Carry Caesar's letter to Cicero at Capua",say:[["Cicero",'From Caesar? He writes charmingly. He always has. "Stay out of it," he says, "and remain my friend."'],["Cicero","Pompeius has the better cause and the worse plan. Caesar has no cause at all and never makes a mistake. What is an honest man to do?"],[Ex,"Caesar asks only that you stay neutral."],["Cicero","Neutral. Tell him I know whom to flee, but not whom to follow. Pompeius is marching for Brundisium and the ships. If you want to see the end of the Republic, ride the Appian Way."]]},{t:"kill",at:"brundisium",off:[-46,-40],lvl:3,foes:[["miles",3],["sagittarius",1]],obj:"Break through Pompey's rearguard at Brundisium",say:[["","Pompeius has walled up the streets and dug pits behind him. A rearguard holds the road while the last ships load."]],after:[["","Too late. The transports are standing out to sea, and Caesar has no fleet to chase them."]]},{t:"talk",npc:"caesar",at:"brundisium",obj:"Report to Caesar in Brundisium",give:{ship:1,items:["hamata"]},say:[[zt,"Sixty days, and all Italy is mine without a battle. Yet Pompeius still has the fleet, the East, and seven legions in Spain."],[zt,"I cannot follow him without ships. So I go to Spain first, to fight an army without a general. Afterwards I will deal with the general without an army."],[zt,"I have requisitioned a liburnian galley for my dispatches. She is yours. Put on a mail shirt, and sail for Massilia. Decimus Brutus commands my ships there."]]}]},{id:"m3",main:1,name:"An Army Without a General",date:"April to August, 49 BC",lvl:4,reward:{xp:260,den:140},steps:[{t:"talk",npc:"decimus",at:"massilia",off:[-70,30],obj:"Sail to Massilia and find Decimus Brutus",say:[["Decimus","Dispatches from Caesar? Welcome to the siege. Massilia swore it was neutral, then let Domitius Ahenobarbus sail in and take command."],["Decimus","I built twelve ships at Arelate in thirty days, from green timber. They handle like barges. But my marines are picked men from the legions, and when we grapple, we win."],["Decimus","Their raiders sortie at dusk to burn our siege works. Help my men hold the ramp, and I will see that Caesar hears of it."]]},{t:"kill",at:"massilia",off:[-90,10],lvl:4,foes:[["miles",2],["sagittarius",2],["pirata",2]],obj:"Drive off the Massiliot raiders",after:[["Decimus","Well fought. Caesar is in Spain, near Ilerda. Take the Via Domitia over the Pyrenees."]]},{t:"kill",at:"ilerda",off:[40,46],lvl:5,foes:[["miles",4],["centurio",1]],obj:"At Ilerda, stop the Pompeian water carriers reaching the river",say:[["","Caesar has dug a trench between the enemy and the river Sicoris. Thirst will do what swords need not. A column tries to force its way to the water."]]},{t:"talk",npc:"caesar",at:"ilerda",obj:"Report to Caesar at Ilerda",give:{items:["coolus"]},say:[[zt,"Afranius and Petreius have surrendered. Five legions, and I did not have to slaughter them."],[zt,"I have sent every man home unharmed. Let Pompeius' friends call it weakness. Mercy is a new way of conquering."],[zt,"Spain is settled. Now for the general. Sail to Epirus, to my camp south of Dyrrachium. Antonius is bringing the rest of the army across the Adriatic."]]}]},{id:"m4",main:1,name:"A General Without an Army",date:"January to August, 48 BC",lvl:6,reward:{xp:420,den:220},steps:[{t:"talk",npc:"antonius",at:"castra",obj:"Sail to Epirus and find Antonius at Caesar's camp",say:[[Ui,"You made it past Bibulus' blockade? He sleeps on his flagship in midwinter to keep us out. The man hates Caesar more than he loves living."],[Ui,"We have Pompeius penned against the sea with seventeen miles of earthworks. It is madness. He has more men inside than we have outside, and his fleet feeds him while we eat roots."],[Ui,"Two Gallic deserters have shown him the unfinished stretch by the shore. He is coming through tonight. Get to the south wall."]]},{t:"kill",at:"castra",off:[-36,50],lvl:6,foes:[["miles",4],["sagittarius",2],["centurio",1]],obj:"Hold the breach in the siege line",after:[["","You hold your stretch of wall, but the line breaks elsewhere and the army runs. Nearly a thousand men and thirty-two standards are lost."],[zt,"Today the victory would have been theirs, if they had a general who knew how to win."],[zt,"We march inland to Thessaly. Pompeius will follow. His senators will give him no peace until he fights."]]},{t:"talk",npc:"crastinus",at:"pharsalus",obj:"Ride to the plain of Pharsalus",say:[["Crastinus","Gaius Crastinus, lately first spear of the Tenth. I came back as a volunteer for this one battle."],["Crastinus","Pompeius has twice our infantry and seven times our horse. Labienus leads the cavalry. He was Caesar's right hand in Gaul, and now he has sworn not to return to camp except as victor."],["Crastinus","Caesar has hidden a fourth line behind our right, with orders to thrust their javelins at the riders' faces. Follow me. I shall earn the general's thanks today, alive or dead."]]},{t:"kill",at:"pharsalus",off:[50,-44],lvl:7,foes:[["miles",5],["sagittarius",2],["centurio",2]],obj:"Fight in the front line at Pharsalus",after:[["","The cavalry breaks against the hidden cohorts and the whole Pompeian left folds. Crastinus dies in the first charge, a sword through the mouth. Caesar orders him a hero's burial."]]},{t:"talk",npc:"caesar",at:"pharsalus",obj:"Find Caesar in the captured camp",give:{items:["scutum13"]},say:[[zt,"Look at their tents. Tables laid with silver, floors of fresh turf, ivy on the poles. They were dividing my offices among themselves last night."],[zt,"They would have it so. After all I had done, I, Gaius Caesar, would have been condemned if I had not asked my army for help."],[zt,"Pompeius rode off before the camp fell. He will run to Egypt, where the boy king owes him a throne. Take your ship to Alexandria. I follow with the galleys."]]}]},{id:"m5",main:1,name:"The Nile",date:"October, 48 BC to March, 47 BC",lvl:8,reward:{xp:600,den:300},steps:[{t:"talk",npc:"caesar",at:"alexandria",off:[20,-10],obj:"Sail to Alexandria",say:[["","You arrive to find Caesar already in the royal quarter, his face grey."],[zt,"They brought me his head. Pompeius Magnus, three times a triumphator, stabbed in a rowing boat off Pelusium by a Roman who once served under him. They thought it would please me."],[zt,"I turned away. I kept only his signet ring, a lion holding a sword. He was my enemy. He was also my son-in-law, and a Roman."],[zt,"The boy Ptolemy and his sister are at war over the throne. I mean to settle it, and to collect what their father owed me. Go to the harbour. A Sicilian named Apollodorus has a delivery for the palace."]]},{t:"talk",npc:"apollodorus",at:"alexandria",off:[-52,34],obj:"Meet Apollodorus by the harbour at Alexandria",say:[["Apollodorus","Quietly, Roman. The king's soldiers watch every gate, and my mistress has been shut out of her own city."],["Apollodorus","So she comes in as baggage. A sack for bedclothes, tied with a strap, and me to carry it over my shoulder past the guards."],["","Plutarch tells the story this way, with a bedding sack. The rolled carpet is a later invention."]]},{t:"talk",npc:"cleopatra",at:"alexandria",off:[26,-18],obj:"Go to the palace",say:[["Cleopatra","So this is how Caesar's messengers look. Stand up straight. I have just been carried through my own gate like laundry, and I still have better posture."],["Cleopatra","I am the first of my house in three hundred years to learn the Egyptian tongue. I speak nine languages. My brother speaks through his eunuch."],["Cleopatra","That eunuch, Pothinus, has sent for the army. Twenty thousand men under Achillas, many of them Roman soldiers who stayed here and forgot they were Roman. They will be at the palace by nightfall."]]},{t:"kill",at:"alexandria",off:[-18,44],lvl:8,foes:[["aegyptius",5],["sagittarius",2]],obj:"Defend the palace quarter",say:[["","Caesar orders the ships in the harbour burned to keep them from Achillas. The fire leaps to the dockside warehouses, and scrolls stored for the Library burn with them."]]},{t:"kill",at:"alexandria",off:[-78,-30],lvl:9,foes:[["aegyptius",4],["achillas",1]],obj:"Seize the causeway to the Pharos",say:[["","Who holds the lighthouse island holds the harbour mouth. The fight for the causeway goes badly, and Caesar has to swim for it, holding his papers above the water in one hand."]]},{t:"talk",npc:"caesar",at:"alexandria",off:[20,-10],obj:"Return to Caesar",give:{items:["squamata"]},say:[[zt,"The relief army has come through Pelusium. The king's forces broke on the Nile, and the boy drowned in his golden armour when his boat capsized."],[zt,"Cleopatra reigns, with her youngest brother beside her for form's sake. Egypt will pay its debts."],[zt,"I have stayed too long. Pharnaces of Pontus has overrun Asia Minor, and the Pompeians are gathering in Africa. Meet me at Tarsus in Cilicia."]]}]},{id:"m6",main:1,name:"Veni, Vidi, Vici",date:"August, 47 BC to April, 46 BC",lvl:10,reward:{xp:800,den:380},steps:[{t:"goto",at:"tarsus",r:34,obj:"Sail to Tarsus in Cilicia",say:[["","Caesar has already held his assembly here and marched north. Pharnaces, son of the great Mithridates, is camped at Zela in Pontus."]]},{t:"kill",at:"zela",off:[44,40],lvl:10,foes:[["ponticus",6],["sagittarius",2]],obj:"Ride north to Zela and join the battle",say:[["","Pharnaces does something no one expects. He charges uphill at the Roman camp while the legions are still digging."]]},{t:"talk",npc:"caesar",at:"zela",obj:"Speak with Caesar at Zela",say:[[zt,"Four hours. Five days after I arrived. Pompeius made his name beating such armies."],[zt,"Take a letter to my friend Matius in Rome. It need only say three words: Veni, vidi, vici."],[zt,"But first, Africa. Scipio and Cato have ten legions there, and King Juba brings elephants. Meet my fleet at Thapsus."]]},{t:"kill",at:"thapsus",off:[-44,-42],lvl:11,foes:[["numida",4],["miles",4],["centurio",1]],obj:"Sail to Thapsus and fight in the line",say:[["",'The veterans do not wait for orders. A trumpeter of the Tenth sounds the charge on his own, and Caesar gives the word "Good fortune" and rides with them. Slingers turn the elephants back on their own army.']]},{t:"goto",at:"utica",r:34,obj:"Ride to Utica",say:[["","The town is in mourning. Cato read Plato's dialogue on the soul twice through, asked for his sword, and died by his own hand rather than owe his life to Caesar."],[zt,"Cato, I grudge you your death, as you grudged me the chance to spare you."],["","The Republic's last armies gather in Spain under Pompey's sons and Labienus."]]}]},{id:"m7",main:1,name:"For His Life",date:"March, 45 BC",lvl:12,reward:{xp:1e3,den:450,items:["decima"]},steps:[{t:"talk",npc:"centurion",at:"munda",obj:"Travel to Caesar's camp before Munda",say:[["Centurion","Thirteen legions on that ridge under young Gnaeus Pompeius, and they hold the high ground. We must attack uphill."],["Centurion","Labienus is with them. He knows every trick Caesar has, because he helped invent half of them."],["Centurion",'The password today is "Venus". Stay close to the Tenth on the right.']]},{t:"kill",at:"munda",off:[46,44],lvl:12,foes:[["miles",5],["iber",3],["centurio",2]],obj:"Fight up the slope at Munda",say:[["",'The line wavers. Caesar snatches a shield, runs out ahead of the standards and shouts at his men: "Are you going to hand me over to these boys?"']]},{t:"kill",at:"munda",off:[70,70],lvl:13,foes:[["labienus",1],["miles",3]],obj:"Face Titus Labienus",say:[["Labienus","Caesar's errand boy. I conquered Gaul while he wrote the book about it. Come, then."]],after:[["","Labienus falls, and thirty thousand with him. Caesar grants his old lieutenant an honourable burial."],[zt,"I have often fought for victory. Today, for the first time, I fought for my life."],[zt,"It is finished. Come to Rome. There is a great deal to put in order, and not much time."]]}]},{id:"m8",main:1,name:"The Ides of March",date:"March, 44 BC",lvl:13,reward:{xp:1500,den:600,items:["musculata","attic"]},steps:[{t:"talk",npc:"caesar",at:"roma",off:[6,14],obj:"Return to Rome and find Caesar in the Forum",say:[[zt,"There you are. I have reformed the calendar, did you hear? Three hundred and sixty-five days, and a leap day every fourth year. Sosigenes of Alexandria did the sums."],[zt,"They have named me dictator for life. They vote me honours faster than I can refuse them, and resent me for each one."],[zt,"In three days I leave for Parthia, to bring back the eagles Crassus lost. I have dismissed my Spanish bodyguard. It is better to die once than to live always in fear of death."],[zt,"Go and rest. The Senate meets on the Ides in Pompeius' theatre."]]},{t:"talk",npc:"artemidorus",at:"roma",off:[-30,-26],obj:"A Greek teacher is asking for you near the Forum",say:[["Artemidorus","You are Caesar's man? Thank the gods. I teach Greek in the house of Brutus, and I hear things."],["Artemidorus","There are sixty of them. Cassius, Casca, Trebonius, Marcus Brutus. And Decimus Brutus, who dines at Caesar's table and is named in his will."],["Artemidorus","I have written it all in this scroll. He must read it himself, at once, alone. Go to his house before he leaves for the Senate."]]},{t:"talk",npc:"calpurnia",at:"roma",off:[34,20],obj:"Hurry to Caesar's house",say:[["Calpurnia","You have missed him. I begged him to stay. I dreamed I held him in my arms, covered in wounds, and the soothsayer found no heart in the sacrifice."],["Calpurnia","He had agreed to send word that he was unwell. Then Decimus Brutus came, laughing, and asked what the Senate would say if told to come back when Calpurnia has better dreams."],["Calpurnia","Decimus led him out by the hand. Run. The Senate meets at the theatre of Pompeius."]]},{t:"goto",at:"roma",off:[-44,30],r:12,obj:"Run to the Theatre of Pompey",say:[["","You push through the crowd as the litter sets down. Artemidorus is there before you and presses the scroll into Caesar's own hand."],["","Caesar tries several times to read it, but petitioners crowd around him. He is still holding it, unread, when he goes in."],["","Trebonius keeps Antonius talking at the door. Inside, Tillius Cimber pulls the toga from Caesar's shoulder. That is the signal."],["","Twenty-three wounds. He falls at the foot of Pompey's statue, having drawn his toga over his face."]]},{t:"kill",at:"roma",off:[-30,44],lvl:14,foes:[["gladiator",6]],obj:"Fight your way clear of Decimus Brutus' gladiators",say:[["","The killers march to the Capitol behind a troop of gladiators Decimus had waiting near the theatre. They take you for one of Antonius' men."]]},{t:"talk",npc:"antonius",at:"roma",off:[6,14],obj:"Find Antonius in the Forum",say:[[Ui,"I read them his will. Three hundred sesterces to every citizen, and his gardens across the Tiber to the people. Then I held up the toga and showed them the holes."],[Ui,"They are burning his body in the Forum itself, on a pyre of benches. Brutus and Cassius will not sleep in Rome tonight."],[Ui,"One more thing was in that will. He adopted his sister's grandson and left him three quarters of everything. A boy of eighteen, studying in Apollonia. He is said to have landed near Brundisium."]]},{t:"talk",npc:"octavius",at:"brundisium",off:[12,16],obj:"Meet Caesar's heir at Brundisium",say:[["Octavius","You served my great-uncle from the Rubicon to the end. Then you know what was done to him, and by whom."],["Octavius","My mother writes that I should refuse the inheritance. My stepfather says the name will get me killed. The legions here have already hailed me by it."],["Octavius","I will take the name, and the debt that comes with it. From today I am Gaius Iulius Caesar."],["","Thirteen years of war lie ahead. When they end, the young man will be Augustus, and the Republic you were born in will be a memory."],["","Your part in the story is told. The whole Roman world is still yours to explore."]]}]},{id:"s_arena",name:"Blood and Sand",lvl:3,giver:{npc:"lanista",at:"capua",off:[30,-24]},reward:{xp:220,den:150,items:["sica"]},steps:[{t:"talk",npc:"lanista",at:"capua",off:[30,-24],obj:"Speak with the lanista in Capua",say:[["Scaurus","This school belongs to Caesar himself. Five thousand shields in the armoury, they say in Rome, as if it were a private army."],["Scaurus","With the master at war, the crowds are thin and my men are bored. You have a soldier's shoulders. Three bouts on the sand, wooden rules, real blades. Interested?"],["","Most gladiator fights did not end in death. A trained man was far too expensive to waste."]]},{t:"kill",at:"capua",off:[44,-34],lvl:3,foes:[["gladiator",1]],obj:"First bout: defeat the Thracian"},{t:"kill",at:"capua",off:[44,-34],lvl:4,foes:[["gladiator",2]],obj:"Second bout: defeat the pair"},{t:"kill",at:"capua",off:[44,-34],lvl:5,foes:[["gladiator",3]],obj:"Final bout: defeat three at once"},{t:"talk",npc:"lanista",at:"capua",off:[30,-24],obj:"Collect your winnings from Scaurus",say:[["Scaurus","The crowd will talk of that for a month. Your purse, and a Thracian's sica to remember us by."]]}]},{id:"s_grain",name:"The Grain Fleet",lvl:2,giver:{npc:"frumentarius",at:"ostia",off:[-10,14]},reward:{xp:150,den:120},steps:[{t:"talk",npc:"frumentarius",at:"ostia",off:[-10,14],obj:"Speak with the grain factor in Ostia",say:[["Quintus","Rome eats two hundred thousand tons of wheat a year, and every grain of it comes through this harbour."],["Quintus","Pompeius swept the pirates off the sea in three months, eighteen years ago. Now he has taken the fleet east, and the rats are back. A crew has beached down the coast with one of my barges."]]},{t:"kill",at:"ostia",off:[20,80],lvl:2,foes:[["pirata",4]],obj:"Deal with the pirates on the shore south of Ostia"},{t:"talk",npc:"frumentarius",at:"ostia",off:[-10,14],obj:"Return to Quintus",say:[["Quintus","The barge is back and the price of bread will hold another week. Rome has rioted over less. Here is your share."]]}]},{id:"s_appia",name:"Robbers on the Queen of Roads",lvl:3,giver:{npc:"viator",at:"brundisium",off:[-20,-22]},reward:{xp:200,den:130,items:["scutum"]},steps:[{t:"talk",npc:"viator",at:"brundisium",off:[-20,-22],obj:"Speak with the carter in Brundisium",say:[["Publius","Three hundred and sixty miles of fitted stone from here to Rome, and Appius Claudius built the first of it two and a half centuries ago. They call it the queen of roads."],["Publius","A queen with fleas. Deserters from both armies have made a camp in the hills past the fourth waystation and they stop every cart. They took my load, and a good legion shield I was carrying for my brother."]]},{t:"kill",at:[40.72,16.55],lvl:3,foes:[["latro",4],["miles",1]],obj:"Clear the deserters' camp beside the Via Appia"},{t:"talk",npc:"viator",at:"brundisium",off:[-20,-22],obj:"Return to Publius",say:[["Publius","My brother is dead at Dyrrachium, I heard this morning. Keep the shield. It should belong to someone who will use it."]]}]},{id:"s_tomb",name:"The Sphere and the Cylinder",lvl:4,giver:{npc:"scholar",at:"syracusae",off:[-16,20]},reward:{xp:260,den:100},steps:[{t:"talk",npc:"scholar",at:"syracusae",off:[-16,20],obj:"Speak with the geometer in Syracuse",say:[["Demetrios","Archimedes held off the Roman fleet for two years with his machines. When the city fell, a soldier cut him down over his diagrams."],["Demetrios","He asked for one thing on his tomb: a sphere inside a cylinder, for he had proved the one is exactly two thirds of the other."],["Demetrios","Cicero found the grave thirty years ago, choked with brambles, when our own magistrates denied it existed. They have let it vanish again. It lies outside the gate toward Agrigentum. Will you look?"]]},{t:"find",at:"syracusae",off:[-84,-40],obj:"Search the thickets west of Syracuse for the tomb",say:[["","A small column rises above the thorns. On top, worn but clear: a sphere set inside a cylinder, and half a line of verse."]]},{t:"talk",npc:"scholar",at:"syracusae",off:[-16,20],obj:"Tell Demetrios what you found",say:[["Demetrios","Then it stands. The greatest mind of the Greeks, and a Roman soldier has to show us where he lies. I will have the brambles cut. Thank you."]]}]},{id:"s_carthage",name:"Delenda Est",lvl:6,giver:{npc:"antiquarian",at:"utica",off:[16,18]},reward:{xp:320,den:200},steps:[{t:"talk",npc:"antiquarian",at:"utica",off:[16,18],obj:"Speak with the old settler in Utica",say:[["Sittius","My grandfather watched Carthage burn for seventeen days. Old Cato ended every speech with it: Carthage must be destroyed. Well, it was."],["Sittius","The tale that the fields were sown with salt is nonsense, by the way. The land was parcelled out and farmed. I farm some of it."],["Sittius","Grave robbers are digging in the old sanctuary for Punic gold. There is a carved stone there with the sign of Tanit that I would see kept safe. Bring it to me."]]},{t:"kill",at:"carthago",off:[10,10],lvl:6,foes:[["latro",3],["numida",2]],obj:"Drive the grave robbers out of the ruins of Carthage"},{t:"find",at:"carthago",off:[-14,-8],obj:"Recover the stele of Tanit from the sanctuary",say:[["","A limestone slab with a triangle, a bar and a circle: the goddess of a city that once ruled the western sea."]]},{t:"talk",npc:"antiquarian",at:"utica",off:[16,18],obj:"Bring the stele to Sittius",say:[["Sittius","Caesar means to plant a colony there, I hear. Roman houses on Punic foundations. Someone should remember what lay underneath."]]}]},{id:"s_vercingetorix",name:"The King in the Dark",lvl:5,giver:{npc:"brennos",at:"bibracte",off:[10,14]},reward:{xp:300,den:120},steps:[{t:"talk",npc:"brennos",at:"bibracte",off:[10,14],obj:"Speak with the Aeduan elder at Bibracte",say:[["Brennos","In this town all Gaul chose Vercingetorix of the Arverni to lead it. One summer later he rode out of Alesia in his best armour, circled Caesar's chair, and threw down his weapons at his feet."],["Brennos","That was three years ago. He sits in a pit under your Capitol, waiting to be walked in Caesar's triumph and strangled after."],["Brennos","We fought beside him, and we fought against him. Carry this torc to his keeper. Let him know that Gaul has not forgotten his name."]]},{t:"talk",npc:"jailer",at:"roma",off:[-16,-40],obj:"Take the torc to the Tullianum prison in Rome",say:[["Keeper","The Gaul? Twelve feet down, through a hole in the floor. Jugurtha of Numidia starved in the same cell."],["Keeper","He does not speak. He will be kept until Caesar has time for his triumph. I will lower the gold down to him. I promise nothing more."],["","Vercingetorix was held for six years and executed after Caesar's triumph in 46 BC."]]}]},{id:"s_rhodes",name:"Scrolls for Rhodes",lvl:7,giver:{npc:"cratippus",at:"athenae",off:[-14,22]},reward:{xp:380,den:220},steps:[{t:"talk",npc:"cratippus",at:"athenae",off:[-14,22],obj:"Speak with the philosopher in Athens",say:[["Cratippus","A Roman who listens! Usually they come to Athens to be seen listening. Cicero wants to send me his son, and I fear the boy prefers wine to Aristotle."],["Cratippus","I have copies of my lectures promised to the school at Rhodes. No captain will carry them while two Roman fleets hunt each other. You have a ship."]]},{t:"talk",npc:"rhetor",at:"rhodus",off:[14,16],obj:"Deliver the scrolls to the school of rhetoric at Rhodes",say:[["Menekles","From Cratippus? Excellent. Your Caesar studied in this very colonnade under Apollonius Molon. On the way here he was captured by pirates, joked that he would crucify them, and later did."],["Menekles","You will have seen our Colossus on the way in. A hundred feet of bronze, and it stood only fifty-four years before the earthquake. The oracle forbade us to raise it again, so there it lies. Few men can get their arms around the thumb."]]}]},{id:"s_library",name:"What the Fire Spared",lvl:9,req:"m5",giver:{npc:"librarian",at:"alexandria",off:[40,26]},reward:{xp:500,den:260,items:["aspis"]},steps:[{t:"talk",npc:"librarian",at:"alexandria",off:[40,26],obj:"Speak with the scholar near the Library",say:[["Sosigenes","Every ship that enters this harbour is searched for books. We copy them, keep the originals, and return the copies. That is how one builds the greatest library in the world."],["Sosigenes","The fire your general lit has burned the dockside stores. Some say forty thousand scrolls were in them, waiting to be shelved. A few crates were dragged clear. Find them before the looters do."]]},{t:"find",at:"alexandria",off:[-62,52],obj:"Search the burned warehouses for scroll crates",say:[["","A cedar crate, scorched on one side. Inside, wound tight in linen: works on the motion of the stars."]]},{t:"kill",at:"alexandria",off:[-84,30],lvl:9,foes:[["latro",4],["aegyptius",1]],obj:"Stop the looters at the next warehouse"},{t:"talk",npc:"librarian",at:"alexandria",off:[40,26],obj:"Return to Sosigenes",say:[["Sosigenes","Astronomy. Then I can finish the sums I owe your Caesar: a year of three hundred and sixty-five days and a quarter. Rome's calendar has drifted three months out of step with the sun."]]}]},{id:"s_gades",name:"The Statue of Alexander",lvl:10,giver:{npc:"priest",at:"gades",off:[-12,18]},reward:{xp:520,den:240,items:["falcata"]},steps:[{t:"talk",npc:"priest",at:"gades",off:[-12,18],obj:"Speak with the priest of Hercules at Gades",say:[["Priest","This temple is older than Rome. The Tyrians built it for Melqart, whom you call Hercules, when they first sailed through the Pillars."],["Priest","Twenty years ago a young quaestor stood before our statue of Alexander and wept. Alexander had conquered the world at his age, he said, and he had done nothing. His name was Caesar."],["Priest","Men who call themselves Pompeians have robbed the offerings and fled up the Corduba road. The god will reward whoever returns them."]]},{t:"kill",at:[36.95,-5.75],lvl:10,foes:[["iber",4],["miles",2]],obj:"Catch the temple robbers on the road to Corduba"},{t:"talk",npc:"priest",at:"gades",off:[-12,18],obj:"Return the offerings to the temple",say:[["Priest","The god is satisfied. Take this blade from the armoury, Iberian steel, buried in the ground for two years so that only the best of it survives."]]}]},{id:"s_pyramids",name:"Older Than Rome",lvl:8,giver:{npc:"guide",at:"memphis",off:[12,16]},reward:{xp:400,den:150},steps:[{t:"talk",npc:"guide",at:"memphis",off:[12,16],obj:"Speak with the guide in Memphis",say:[["Petosiris","Greek visitors have been coming to see them for four hundred years, and scratching their names on the stones. Herodotus was told a hundred thousand men built the great one."],["Petosiris","When your city was a few huts on a hill, they were already two thousand years old. Go and stand beneath them. Then tell me again about Roman greatness."]]},{t:"goto",at:"pyramides"
